.v7-mlg b{display:block;padding-left:14px;color:var(--text);font-size:13.5px;font-variant-numeric:tabular-nums}


/* ===== v0.7 — khớp chức năng ClaimMVP rev 401 (05/10/2026) ===== */
.sev{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.03em;padding:3px 9px;border-radius:999px}
.sev.HIGH{background:var(--danger-tint);color:var(--danger)}
.sev.MEDIUM{background:var(--warn-tint);color:var(--warn)}
.sev.LOW{background:var(--info-tint);color:var(--info)}
.sigcard{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.sigcard .sh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.sigcard .sh .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--ai-grad);color:#fff}
.sigrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);align-items:start}
.sigrow:last-child{border-bottom:0}
.sigrow.off{opacity:.55}
.sigrow .ty{font-family:var(--mono);font-size:11.5px;font-weight:700}
.sigrow .ex{font-size:13px;margin-top:4px}
.sigrow .evd{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
.blocked-chip{display:inline-flex;align-items:center;gap:6px;background:var(--danger);color:#fff;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;box-shadow:0 4px 12px rgba(211,58,58,.28)}
.cat-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ok-tint);color:var(--ok);margin-left:6px;vertical-align:middle}
.cat-chip.part{background:var(--info-tint);color:var(--info)}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.rcell{border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:var(--surface)}
.rcell .rk{display:flex;align-items:center;gap:6px;font-weight:800;font-size:12px}
.rcell .rd{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.rcell.PASS{border-color:rgba(22,163,74,.35)}
.rcell.WARN{border-color:var(--warn);background:var(--warn-tint)}
.rcell.SKIPPED{background:var(--surface-2)}
.rcell.INCOMPLETE{border-color:var(--danger);background:var(--danger-tint)}
.rst{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:auto}
.rst.PASS,.rst.COMPLETE{background:var(--ok-tint);color:var(--ok)}
.rst.WARN{background:var(--warn);color:#fff}
.rst.SKIPPED{background:var(--border);color:var(--muted)}
.rst.INCOMPLETE{background:var(--danger);color:#fff}
.edited{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;background:var(--info-tint);color:var(--info);margin-left:6px}
.orig{display:block;font-size:11px;color:var(--muted);text-decoration:line-through}
.vbox{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border-strong);display:inline-grid;place-items:center;cursor:pointer;background:var(--surface);color:#fff;font-size:12px;font-weight:900}
.vbox.on{background:var(--ok);border-color:var(--ok)}
.vby{font-size:10.5px;color:var(--muted);display:block;margin-top:2px;white-space:nowrap}
.pen{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:2px 4px;border-radius:6px}
.pen:hover{background:var(--surface-2);color:var(--text)}
.letters{display:grid;gap:10px;margin-top:10px}
.letter{border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface)}
.letter .lic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--ai-tint);color:var(--ai-ink)}
.letter.sent .lic{background:var(--ok-tint);color:var(--ok)}
.paper{background:#fffdf8;color:#1d2433;border:1px solid #e9e1cf;border-radius:10px;padding:20px 22px;font-size:13.5px;line-height:1.6;box-shadow:inset 0 0 0 6px #fff,0 8px 24px rgba(0,0,0,.08);max-height:52vh;overflow:auto}
.paper h4{margin:0 0 8px;font-size:15px}
.paper .pm{font-size:11px;color:#7a7f8c;margin-bottom:12px}
.paper ul{padding-left:18px;margin:8px 0}
.rawdoc{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;font-family:var(--mono);font-size:11px;color:#1d2433;line-height:1.55;max-height:56vh;overflow:auto}
.rawdoc .rhd{text-align:center;font-weight:800}
.rawdoc table{width:100%;border-collapse:collapse;margin-top:8px}
.rawdoc td,.rawdoc th{border:1px solid #c9ced8;padding:3px 5px;font-size:10.5px}
.wm{color:#9aa1ad;font-size:10px;text-align:center;margin-top:8px}
.missing{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px dashed var(--warn);border-radius:10px;background:var(--warn-tint);margin-top:8px}
.hist{margin-top:8px;border-top:1px dashed var(--border);padding-top:8px}
.hist .hr{display:grid;grid-template-columns:42px 1fr auto;gap:10px;font-size:12px;padding:5px 0}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.radio-list label{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:13px}
.radio-list label:has(input:checked){border-color:var(--primary);background:var(--primary-tint)}
.preview-say{font-size:12.5px;background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:8px}
@media (max-width:900px){.rgrid{grid-template-columns:1fr 1fr}}
.attn{margin-top:16px;border:1px solid var(--border);border-radius:var(--radius);background:linear-gradient(180deg,var(--ai-tint),var(--surface) 70%);padding:14px 16px}
.attn-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.attn-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.attn-i{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:12px;cursor:pointer;color:var(--text);font:inherit;font-size:13px;transition:.15s}
.attn-i:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(16,24,40,.08);border-color:var(--border-strong)}
.attn-i b{font-size:18px;margin-right:2px}
.attn-i small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.attn-i .ai-ic{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center}
.attn-i.r .ai-ic{background:var(--danger-tint);color:var(--danger)}
.attn-i.y .ai-ic{background:var(--warn-tint);color:var(--warn)}
.attn-i.i .ai-ic{background:var(--ai-tint);color:var(--ai-ink)}
.attn-i.n .ai-ic{background:var(--surface-2);color:var(--muted)}
.qchips{display:flex;gap:6px;flex-wrap:wrap}
.qchip{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.qchip b{margin-left:4px;color:var(--muted)}
.qchip.on{background:var(--primary-tint);border-color:var(--primary);color:var(--primary)}
.qchip.on b{color:var(--primary)}
@media (max-width:900px){.attn-g{grid-template-columns:1fr 1fr}}
.tab.active .cnt{background:var(--warn)}

/* ===== v0.8 — A1–A7 sau demo nội bộ 08/10/2026 ===== */
.mock{border-style:dashed!important;border-color:var(--ai-border)!important}
.mock-lbl{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ai);border:1px dashed var(--ai-border);border-radius:6px;padding:1px 6px;margin-left:6px}
.v8-rolesw{display:inline-flex;align-items:center;gap:4px;margin-top:4px;border:1px dashed rgba(255,255,255,.35);background:transparent;color:inherit;opacity:.85;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px}
.v8-rolesw svg{width:12px;height:12px}
.v8-rolesw:hover{opacity:1}
.sidebar .v8-rolesw{color:rgba(255,255,255,.82);border-color:rgba(255,255,255,.32)}
#v8tip{position:fixed;z-index:200;max-width:300px;background:#141a22;color:#fff;font-size:12px;line-height:1.45;padding:8px 10px;border-radius:8px;box-shadow:0 10px 26px rgba(0,0,0,.28);pointer-events:none;opacity:0;transition:opacity .12s;white-space:pre-line}
#v8tip.on{opacity:1}

/* A1 — Agent đang làm gì */
.a1{margin:14px 0 6px;border-radius:14px;padding:16px 18px 14px;background:linear-gradient(180deg,var(--ai-tint),var(--surface));border:1px solid var(--ai-border);box-shadow:var(--shadow)}
.a1-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.a1-h .sub{max-width:520px}
.a1-clock{margin-left:auto;display:flex;align-items:center;gap:10px}
.a1-clock b{font:800 26px/1 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--ai-ink);letter-spacing:-.01em}
.a1-clock .lv{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--ai);color:#fff}
.a1-clock .lv.end{background:var(--ok)}
.a1-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:24px;margin-top:14px}
.a1-cell{position:relative;border:1px solid var(--border);border-radius:12px;padding:10px 11px 9px;background:var(--surface);min-height:128px;display:flex;flex-direction:column;gap:2px;transition:border-color .3s,box-shadow .3s,background .3s}
.a1-cell.wait{background:var(--surface-2)}
.a1-cell.wait .nm,.a1-cell.wait .out{color:var(--muted)}
.a1-cell.run{border-color:var(--ai-2);box-shadow:0 0 0 3px rgba(159,122,234,.20)}
.a1-cell.done{border-color:rgba(31,157,87,.45)}
.a1-cell.err{border-color:var(--danger);background:var(--danger-tint)}
.a1-cell .who{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.a1-cell .who i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--ai-grad);color:#fff;font-style:normal}
.a1-cell .who i svg{width:13px;height:13px}
.a1-cell.wait .who i{background:var(--border);color:var(--muted)}
.a1-cell.err .who i{background:var(--danger)}
.a1-cell .nm{font-weight:700;font-size:12.5px;line-height:1.25;margin-top:4px}
.a1-cell .out{font-size:11.5px;line-height:1.38;margin-top:2px}
.a1-cell.done .out,.a1-cell.err .out{font-weight:600}
.a1-cell.err .out{color:var(--danger)}
.a1-cell .ft{margin-top:auto;padding-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:10.5px}
.a1-st{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px}
.a1-st.wait{background:var(--border);color:var(--muted)}
.a1-st.run{background:var(--ai-tint);color:var(--ai-ink)}
.a1-st.done{background:var(--ok-tint);color:var(--ok)}
.a1-st.err{background:var(--danger);color:#fff}
.a1-dot{width:7px;height:7px;border-radius:50%;background:var(--ai);display:inline-block;animation:a1blink 1s ease-in-out infinite}
@keyframes a1blink{50%{opacity:.15}}
.a1-sec{font-variant-numeric:tabular-nums;font-weight:800;color:var(--ai)}
.a1-link{font-size:11px;color:var(--ai);background:none;border:0;padding:0;font-weight:700;margin-left:auto}
.a1-link:hover{text-decoration:underline}
.a1-arrow{position:absolute;top:50%;right:-22px;width:20px;height:2px;background:var(--border-strong);border-radius:2px}
.a1-arrow::after{content:"";position:absolute;right:-2px;top:-4px;border:5px solid transparent;border-left:7px solid var(--border-strong)}
.a1-arrow.lit{background:var(--ai);box-shadow:0 0 8px rgba(110,86,207,.6)}
.a1-arrow.lit::after{border-left-color:var(--ai)}
.a1-arrow.lit.fresh::before{content:"";position:absolute;top:-3px;left:0;width:8px;height:8px;border-radius:50%;background:var(--ai-2);animation:a1hop .9s ease-in-out infinite}
@keyframes a1hop{from{left:-2px;opacity:1}to{left:16px;opacity:0}}
.a1-par{position:absolute;top:calc(50% - 11px);right:-21px;width:18px;height:22px;display:grid;place-items:center;font-weight:900;font-size:15px;color:var(--border-strong)}
.a1-par.lit{color:var(--ai)}
.a1-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--muted)}
.a1-foot .mono{font-size:11px}
@media (max-width:1180px){.a1-row{grid-template-columns:repeat(3,minmax(0,1fr))}.a1-cell:nth-child(3n) .a1-arrow,.a1-cell:nth-child(3n) .a1-par{display:none}}
@media (max-width:700px){.a1-row{grid-template-columns:1fr 1fr;gap:12px}.a1-arrow,.a1-par{display:none}}

/* A1 — bản rút gọn cho khách */
.a1c{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:16px 18px}
.a1c-h{display:flex;align-items:center;gap:10px}
.a1c-h b.clk{margin-left:auto;font:800 20px/1 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--teal)}
.a1c-s{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--border)}
.a1c-s:last-child{border-bottom:0}
.a1c-s .a1c-dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--faint);border:2px solid var(--border)}
.a1c-s.run .a1c-dot{border-color:var(--teal);color:var(--teal);background:var(--teal-tint)}
.a1c-s.done .a1c-dot{background:var(--teal);border-color:var(--teal);color:#fff}
.a1c-s.hold .a1c-dot{background:var(--warn-tint);border-color:var(--warn);color:var(--warn)}
.a1c-s .a1c-dot svg{width:15px;height:15px}
.a1c-s b{font-size:13.5px}
.a1c-s .sub{font-size:12px}
.a1c-s .sec{font-variant-numeric:tabular-nums;font-weight:700;font-size:12px;color:var(--muted)}
.a1c-bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.a1c-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#35D3A3);border-radius:999px;transition:width .3s}

/* A2 — Agent trace */
.a2{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:16px 18px;margin-bottom:16px}
.a2-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.a2-f{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.a2-sw{display:inline-flex;align-items:center;gap:8px;margin-left:auto;font-size:12.5px;font-weight:600;cursor:pointer}
.a2-sw input{display:none}
.a2-sw span{width:34px;height:20px;border-radius:999px;background:var(--border-strong);position:relative;transition:.2s}
.a2-sw span::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.a2-sw input:checked+span{background:var(--ai)}
.a2-sw input:checked+span::after{left:16px}
.a2-tl{position:relative;margin-top:6px}
.a2-turn{display:grid;grid-template-columns:40px 1fr;gap:12px;position:relative;padding:12px 0 4px;align-items:start}
.a2-turn::before{content:"";position:absolute;left:19px;top:44px;bottom:-12px;width:2px;background:var(--border)}
.a2-turn:last-child::before{display:none}
.a2-av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--ai-grad);position:relative;z-index:1}
.a2-av svg{width:18px;height:18px}
.a2-av.tool{background:linear-gradient(135deg,#1E6FEB,#4E8CF5)}
.a2-av.det,.a2-av.orch{background:linear-gradient(135deg,#475467,#667085)}
.a2-av.human{background:linear-gradient(135deg,#12454a,#0c3036)}
.a2-turn.err .a2-av{background:linear-gradient(135deg,#D33A3A,#E86464)}
.a2-body{border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface)}
.a2-turn.dec .a2-body{border-color:var(--ai-border);background:linear-gradient(180deg,var(--ai-tint),var(--surface) 80%)}
.a2-turn.human .a2-body{border-color:rgba(12,48,54,.25);background:linear-gradient(180deg,var(--human-tint),var(--surface) 80%)}
.a2-turn.err .a2-body{border-color:var(--danger);background:linear-gradient(180deg,var(--danger-tint),var(--surface) 80%)}
.a2-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.a2-top .tm{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.a2-tool{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border)}
.a2-tool::before{content:"ƒ ";color:var(--muted)}
.a2-idp{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--primary-tint);color:var(--primary)}
.a2-decb{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--ai);color:#fff}
.a2-errb{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--danger);color:#fff}
.a2-in{font-size:12.5px;color:var(--muted);margin-top:6px}
.a2-in b{color:var(--text);font-weight:600}
.a2-why{margin:8px 0 0;padding:0;list-style:none;counter-reset:w;display:grid;gap:4px}
.a2-why li{counter-increment:w;display:grid;grid-template-columns:20px 1fr;gap:6px;font-size:12.5px;line-height:1.45;font-weight:400}
.a2-why li::before{content:counter(w);width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:800;background:var(--ai-tint);color:var(--ai-ink);margin-top:1px}
.a2-concl{margin-top:8px;font-size:13px;font-weight:700}
.a2-concl::before{content:"→ ";color:var(--ai)}
.a2-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:11.5px;color:var(--muted)}
.a2-meta .ho{font-weight:700;color:var(--text)}
.a2-json{margin-top:6px}
.a2-json summary{cursor:pointer;font-size:11.5px;font-weight:700;color:var(--primary)}
.a2-json pre{margin:6px 0 0;padding:10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);font-family:var(--mono);font-size:11px;line-height:1.5;overflow:auto;max-height:260px;white-space:pre-wrap}
.a2-empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}
.a2-turn.flash .a2-body{animation:a2flash 1.6s ease 1}
@keyframes a2flash{0%,40%{box-shadow:0 0 0 4px rgba(159,122,234,.45)}100%{box-shadow:none}}
.pkind{font-size:9.5px;font-weight:800;letter-spacing:.04em;padding:1px 6px;border-radius:6px;background:var(--primary-tint);color:var(--primary);margin-left:4px;vertical-align:1px}

/* A3 — đọc → ghi → sửa */
.a3-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;margin-bottom:14px}
.a3-s{position:relative;display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:11px 13px}
.a3-s .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--ai-grad);flex:none}
.a3-s.w .n{background:linear-gradient(135deg,#1E6FEB,#4E8CF5)}
.a3-s.k .n{background:linear-gradient(135deg,#12454a,#0c3036)}
.a3-s.k.warn{border-color:var(--warn);background:var(--warn-tint)}
.a3-s b{font-size:13px;display:block}
.a3-s .sub{font-size:12px}
.a3-s:not(:last-child)::after{content:"";position:absolute;right:-22px;top:50%;width:16px;height:2px;background:var(--border-strong)}
.a3-s:not(:last-child)::before{content:"";position:absolute;right:-24px;top:calc(50% - 4px);border:5px solid transparent;border-left:6px solid var(--border-strong)}
.src{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;cursor:help}
.src.idp{background:var(--ai-tint);color:var(--ai-ink);border:1px solid var(--ai-border)}
.src.hum{background:var(--human-tint);color:var(--human);border:1px solid rgba(12,48,54,.25)}
.src svg{width:11px;height:11px}
td.rv{position:relative}
td.rv>.rvb{display:inline-block;border:2px solid var(--danger);border-radius:7px;padding:1px 6px;background:var(--danger-tint);color:var(--danger);font-weight:800;cursor:help}
td.rv>.rvb::after{content:"!";display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--danger);color:#fff;font-size:10px;margin-left:5px;vertical-align:1px}
.amt-orig{display:block;font-size:10.5px;color:var(--muted);text-decoration:line-through}
tr.hl td{animation:a3hl 2.2s ease 1}
@keyframes a3hl{0%,50%{background:var(--ai-tint)}100%{background:transparent}}
@media (max-width:900px){.a3-strip{grid-template-columns:1fr}.a3-s::after,.a3-s::before{display:none}}

/* A5 — Tóm tắt cho người duyệt */
.v8-tabs{align-items:center}
.v8-adv{display:inline-flex;align-items:center;gap:8px;margin-left:auto;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;padding:6px 4px;white-space:nowrap}
.v8-adv input{display:none}
.v8-adv span{width:34px;height:20px;border-radius:999px;background:var(--border-strong);position:relative;transition:.2s}
.v8-adv span::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.v8-adv input:checked+span{background:var(--primary)}
.v8-adv input:checked+span::after{left:16px}
.tab.sum{font-weight:800}
.a5{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.a5-q{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:16px 18px}
.a5-q+.a5-q{margin-top:16px}
.a5-qh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.a5-qh .qn{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;background:var(--ai-grad);flex:none}
.a5-qh.h .qn{background:linear-gradient(135deg,#12454a,#0c3036)}
.a5-qh.e .qn{background:linear-gradient(135deg,#475467,#667085)}
.a5-qh h3{margin:0;font-size:14.5px}
.a5-verdict{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 16px;border-radius:12px;background:linear-gradient(135deg,var(--ai-tint),var(--surface));border:1px solid var(--ai-border)}
.a5-verdict .vk{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ai-ink)}
.a5-verdict .vv{font-size:22px;font-weight:800;letter-spacing:-.01em}
.a5-verdict .vv.ok{color:var(--ok)}.a5-verdict .vv.part{color:var(--warn)}.a5-verdict .vv.no{color:var(--danger)}.a5-verdict .vv.na{color:var(--muted)}
.a5-verdict .va{margin-left:auto;text-align:right}
.a5-verdict .va b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.a5-why{display:grid;gap:8px}
.a5-why .r{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);font-size:13px}
.a5-why .r .ri{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--danger-tint);color:var(--danger)}
.a5-why .r .ri.co{background:var(--primary-tint);color:var(--primary)}
.a5-why .r .ri.ok{background:var(--ok-tint);color:var(--ok)}
.a5-why .r .ri svg{width:15px;height:15px}
.a5-why .r b.m{font-variant-numeric:tabular-nums;white-space:nowrap}
.a5-j{display:grid;gap:8px}
.a5-j .r{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;padding:10px 12px;border-radius:10px;border:1px solid var(--border);font-size:13px}
.a5-j .r.open{border-color:var(--warn);background:var(--warn-tint)}
.a5-j .r.bad{border-color:var(--danger);background:var(--danger-tint)}
.a5-j .r.done{background:var(--surface-2)}
.a5-j .r .ck{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;color:#fff;background:var(--ok)}
.a5-j .r.open .ck{background:var(--warn)}
.a5-j .r.bad .ck{background:var(--danger)}
.a5-j .r .sub{font-size:12px}
.a5-j .r.gate{background:var(--surface-2)}
.a5-j .r.gate .ck{background:#98A2B3;font-size:9.5px;font-weight:800}
.a5-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed var(--border)}
.a5-ev table td,.a5-ev table th{padding:7px 10px}
.a5-docs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.a5-docs button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--text)}
.a5-docs button:hover{border-color:var(--primary);color:var(--primary)}
.a5-docs svg{width:14px;height:14px}
.a5-lk{border:0;background:none;color:var(--primary);font-weight:700;padding:0;font-size:12.5px}
@media (max-width:1100px){.a5{grid-template-columns:1fr}}

/* A6 — vai người duyệt */
.v8-test{margin-top:12px;padding:10px 12px;border:1px dashed var(--ai-border);border-radius:10px;background:var(--surface-2);font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.v8-deny{margin-top:8px;font-size:12.5px;border-left:3px solid var(--danger);padding:6px 10px;background:var(--danger-tint);border-radius:0 8px 8px 0;font-family:var(--mono)}
.v8-who{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--human-tint);color:var(--human)}

/* A7 — báo thiếu chứng từ ngay ở màn nộp */
.a7-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.a7-row:last-child{border-bottom:0}
.a7-row .a7-ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--ok-tint);color:var(--ok)}
.a7-row.miss .a7-ico{background:var(--danger-tint);color:var(--danger)}
.a7-row.opt .a7-ico{background:var(--surface-2);color:var(--faint)}
.a7-row.mis .a7-ico{background:var(--warn-tint);color:var(--warn)}
.a7-row.pend .a7-ico{background:var(--ai-tint);color:var(--ai)}
.a7-row b{font-size:13.5px}
.a7-lbl{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border)}
.a7-lbl.ok{background:var(--ok-tint);color:var(--ok);border-color:transparent}
.a7-lbl.bad{background:var(--warn-tint);color:var(--warn);border-color:transparent}
.a7-miss-t{color:var(--danger);font-weight:800;font-size:12.5px}
.a7-warn{margin-top:6px;font-size:12.5px;padding:8px 10px;border-radius:8px;background:var(--warn-tint);color:var(--text);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.a7-sum{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid var(--ok);background:var(--ok-tint)}
.a7-sum.bad{border-color:var(--danger);background:var(--danger-tint)}
.a7-sum b.big{font-size:14px}
.a7-sum .sp{flex:1}
.spin.sm{width:16px;height:16px;border-width:2px}

/* ===== v0.8.1 — A1 chạy ngay trên thẻ "AI đã làm gì" ===== */
.v7-ai{position:relative}
.v7-ai.live{box-shadow:0 14px 44px rgba(110,86,207,.22)}
.v7-ai.live::before{content:"";position:absolute;inset:-2px;border-radius:16px;padding:2px;background:linear-gradient(90deg,#6E56CF,#35D3A3,#9F7AEA,#6E56CF);background-size:300% 100%;animation:ailFlow 3s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.v7-ai.live.fin::before{background:linear-gradient(90deg,#1F9D57,#35D3A3);animation:none}
@keyframes ailFlow{to{background-position:300% 0}}
.ai-chip.live svg{animation:ailSpark 1.6s ease-in-out infinite}
@keyframes ailSpark{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.25) rotate(20deg)}}
.ail-sub{font-size:12.5px;color:var(--ai-ink);font-weight:600;min-height:18px}
.ail-clock{display:flex;align-items:center;gap:8px}
.ail-clock b{font:800 24px/1 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--ai-ink);letter-spacing:-.01em}
.ail-bar{height:3px;border-radius:999px;background:var(--ai-border);margin-top:12px;overflow:hidden}
.ail-bar{position:relative}
.ail-bar i{position:absolute;top:0;bottom:0;left:0;width:28%;background:linear-gradient(90deg,transparent,#9F7AEA,#35D3A3,transparent);border-radius:999px;animation:ailSweep 1.6s ease-in-out infinite}
.v7-ai.live.fin .ail-bar i{animation:none;width:100%;background:linear-gradient(90deg,#1F9D57,#35D3A3)}
@keyframes ailSweep{0%{left:-30%}100%{left:100%}}
.ail-cnt{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.v7-ai.live .v7-step:not(:last-child)::after{background:var(--border)}
.v7-ai.live .v7-step .ln{position:absolute;top:19px;left:44px;right:6px;height:2px;z-index:1;pointer-events:none}
.v7-ai.live .v7-step .ln b{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#9F7AEA,#6E56CF);position:relative;transition:width .35s ease}
.v7-ai.live .v7-step .ln b.flow{width:100%!important;background:repeating-linear-gradient(90deg,var(--ai-2) 0 6px,transparent 6px 14px);background-size:28px 100%;animation:ailFlowLn .7s linear infinite;opacity:.75}
@keyframes ailFlowLn{to{background-position:28px 0}}
.v7-ai.live .v7-step .ln b::after{content:"";position:absolute;right:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--ai-2),0 0 12px 3px rgba(159,122,234,.9);opacity:0;transition:opacity .2s}
.v7-ai.live .v7-step .ln b.lit::after{opacity:1;animation:ailPop .35s ease both}
.v7-ai.live .v7-step .av{transition:transform .25s}
.v7-ai.live .v7-step.run .av{transform:scale(1.08)}
.v7-ai.live .v7-step.run .av::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:2.5px solid transparent;border-top-color:#9F7AEA;border-right-color:#35D3A3;animation:ailSpin .9s linear infinite}
@keyframes ailSpin{to{transform:rotate(360deg)}}
.v7-ai.live .v7-step.human.run .av{background:linear-gradient(135deg,#12454a,#0c3036);box-shadow:0 0 0 6px rgba(53,211,163,.25)}
.v7-ai.live .v7-step.human.run .av::before{border-top-color:#35D3A3;border-right-color:#35D3A3;animation-duration:1.6s}
.v7-step .okb{position:absolute;right:-6px;bottom:-6px;width:17px;height:17px;border-radius:50%;background:var(--ok);color:#fff;font-size:10px;font-weight:900;display:none;place-items:center;border:2px solid var(--surface)}
.v7-ai.live .v7-step.done .okb{display:grid;animation:ailPop .35s cubic-bezier(.2,1.6,.4,1) both}
.v7-ai.live .v7-step.bad .okb{display:grid;background:var(--danger);animation:ailPop .35s cubic-bezier(.2,1.6,.4,1) both}
.v7-ai.live .v7-step.bad .av{animation:ailShake .4s ease 1}
@keyframes ailPop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes ailShake{20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}
.v7-ai.live .v7-step.todo .nm,.v7-ai.live .v7-step.todo .who{opacity:.55}
.lv{margin-top:6px;min-height:66px;padding-right:8px}
.lv .wait{font-size:11.5px;color:var(--faint);display:flex;align-items:center;gap:6px}
.lv .wait::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--border-strong)}
.thk-h{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ai)}
.thk-h b{font-variant-numeric:tabular-nums;font-weight:800}
.thk-d{display:inline-flex;gap:2px}
.thk-d i{width:4px;height:4px;border-radius:50%;background:var(--ai);animation:ailDot 1s ease-in-out infinite}
.thk-d i:nth-child(2){animation-delay:.15s}.thk-d i:nth-child(3){animation-delay:.3s}
@keyframes ailDot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
.thk{margin-top:4px;font-size:11.5px;line-height:1.42;color:var(--muted);font-style:italic;max-height:4.3em;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 1.4em);mask-image:linear-gradient(180deg,transparent 0,#000 1.4em)}
.thk-t{white-space:pre-line}
.thk .caret{display:inline-block;width:6px;height:12px;background:var(--ai);margin-left:2px;vertical-align:-2px;animation:ailCaret 1s steps(1) infinite}
@keyframes ailCaret{50%{opacity:0}}

/* Khối "AI đã làm gì / AI đang xử lý" — gọn lại (13/10 22:55) */
.v7-flow{margin-top:18px}
.v7-step{padding:0 18px 0 0}
.v7-step .nm{font-size:13px;margin-top:10px}
.v7-step .who{font-size:11.5px;margin-top:1px}
.v7-step .out{font-size:12px;line-height:1.4;margin-top:8px}
.v7-step .ms{font-size:11px;margin-top:2px}
/* đường nối: một nét liền mảnh, nằm giữa tâm biểu tượng, không chấm đè lên icon */
.v7-step:not(:last-child)::after,.v7-ai.live .v7-step .ln{top:18px;left:50px;right:12px;height:2px;border-radius:2px}
.v7-ai.live .v7-step .ln b::after{display:none!important}
.v7-ai.live .v7-step .ln b.flow{background:linear-gradient(90deg,rgba(159,122,234,.15) 0%,#9F7AEA 45%,#35D3A3 55%,rgba(53,211,163,.15) 100%)!important;background-size:200% 100%!important;animation:v10lnflow 1.4s linear infinite!important;opacity:1}
@keyframes v10lnflow{from{background-position:100% 0}to{background-position:-100% 0}}
/* biểu tượng đang chạy: một vòng duy nhất, đúng tâm, cùng dáng bo góc với icon */
.v7-ai.live .v7-step.run .av{transform:none}
.v7-step.run .av::after{display:none}
.v7-ai.live .v7-step.run .av::before{inset:-6px;border-radius:16px;border:2px solid rgba(159,122,234,.85);border-top-color:#35D3A3;border-right-color:rgba(159,122,234,.85);animation:v10ring 1.6s ease-in-out infinite}
@keyframes v10ring{0%,100%{box-shadow:0 0 0 0 rgba(159,122,234,.45)}50%{box-shadow:0 0 0 6px rgba(159,122,234,0)}}
.v7-ai.live .v7-step.human.run .av::before{border-color:rgba(53,211,163,.85)}
.v7-step.todo .av{border-style:solid;border-color:rgba(255,255,255,.14)}
.v7-step .okb{right:-5px;bottom:-5px;border-color:#151E5A}
/* chi tiết (tool call / checks / reasoning) và lỗi: hộp mềm, tối đa 3 dòng, rê chuột để xem đủ */
.lv .rsn{margin-top:10px;border-left:0;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.05)}
.lv .rsn-l{font-size:9.5px;margin-bottom:3px;opacity:.9}
.lv .rsn-t{font-size:11px;line-height:1.45;max-height:4.35em;transition:max-height .3s ease}
.lv .err{margin-top:8px;padding:8px 10px;border-radius:8px;background:rgba(255,84,112,.12);color:#FF9DAE!important;font-size:11px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.v7-step:hover .lv .rsn-t{max-height:20em}
.v7-step:hover .lv .err{-webkit-line-clamp:unset;display:block}
.lv .run-st{font-size:12px;margin-top:6px}.lv .run-note{font-size:10.5px;opacity:.75}
/* chân khối: một dòng gọn, có đường ngăn */
.ail-foot{margin-top:14px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);flex-wrap:nowrap;overflow:hidden;white-space:nowrap}
.ail-foot>span:not(.mono):not(.mock-lbl){overflow:hidden;text-overflow:ellipsis;min-width:0;opacity:.75}
.ail-foot>span:nth-child(3){flex:0 1 auto}.ail-foot>span:nth-child(2){flex:1 1 0}
.ail-foot .mock-lbl{flex:none;margin-left:auto}
.ail-bar{margin-top:14px}
html[data-theme="light"] .lv .rsn{background:rgba(4,13,63,.04)}
html[data-theme="light"] .lv .err{background:#FFE9EC;color:#B4233F!important}
html[data-theme="light"] .ail-foot{border-top-color:var(--color-neutral-3)}
html[data-theme="light"] .v7-step .okb{border-color:#fff}
html[data-theme="light"] .v7-step.todo .av{border-color:var(--color-neutral-4)}
@media (max-width:1100px){.v7-step{padding:0 0 16px}}
.lv .err{padding:8px 10px 0;border-bottom:8px solid transparent}
/* ===== Work list v1.0 (13/10 23:00) ===== */
.wl{--wl-line:rgba(255,255,255,.08);--wl-row:rgba(255,255,255,.035);--wl-hover:rgba(255,255,255,.06);--wl-field:rgba(255,255,255,.06)}
html[data-theme="light"] .wl{--wl-line:#E6E8F0;--wl-row:#fff;--wl-hover:#F6F7FC;--wl-field:#F3F4F9}
/* thẻ tóm tắt — bấm để lọc */
.wl-q{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0 0 18px}
.wl-qc{position:relative;display:grid!important;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;padding:16px 18px!important;margin:0!important;min-height:92px;border-radius:14px!important;border:0!important;color:#fff;cursor:pointer;transition:transform .25s,box-shadow .25s,filter .25s;overflow:hidden}
.wl-qc.violet{background:var(--grad-violet,linear-gradient(135deg,#7C5CFF,#4B2FC8))!important}
.wl-qc.cyan{background:var(--grad-cyan)!important}
.wl-qc::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.10)}
.wl-qc .ic{grid-row:1/3;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.2)}
.wl-qc .l{font-size:13px;font-weight:500;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl-qc b{grid-column:2;font-size:26px;font-weight:700;line-height:1.1;display:inline}
.wl-qc small{position:absolute;right:16px;bottom:14px;font-size:11.5px;opacity:.85;z-index:1}
.wl-qc:hover{transform:translateY(-3px);box-shadow:0 18px 34px -18px rgba(0,0,0,.6)}
.wl-qc.on{box-shadow:0 0 0 3px var(--color-neutral-0),0 0 0 5px #fff,0 18px 34px -18px rgba(0,0,0,.6)}
html[data-theme="light"] .wl-qc.on{box-shadow:0 0 0 3px #fff,0 0 0 5px #040D3F}
.wl-qc .x{position:absolute;right:12px;top:10px;font-size:12px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.2);z-index:1}
.wl.has-quick .wl-qc:not(.on){filter:saturate(.6) brightness(.85)}
/* thanh lọc gọn một hàng */
.wl-bar{display:flex!important;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:14px 16px!important;margin:0 0 16px!important;border-radius:16px!important}
.wl-search{flex:1 1 280px;display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:12px;background:var(--wl-field);border:1px solid transparent;color:var(--muted);transition:border-color .2s,box-shadow .2s}
.wl-search:focus-within{border-color:#7C5CFF;box-shadow:0 0 0 3px rgba(124,92,255,.22)}
.wl-search input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:var(--text);font:400 14px 'Sora',sans-serif}
.wl-search .clr{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px}
.wl-f{display:flex;flex-direction:column;gap:5px;flex:0 1 auto}
.wl-f>span{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;padding-left:2px}
.wl-f select,.wl-range>div{height:44px;border-radius:12px;border:1px solid transparent;background:var(--wl-field);color:var(--text);font:400 13.5px 'Sora',sans-serif;padding:0 34px 0 12px;min-width:150px}
.wl-f select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.wl-f select option{color:#040D3F}
.wl-range>div{display:flex;align-items:center;gap:6px;padding:0 12px}
.wl-range input{width:92px;border:0;background:transparent;outline:0;color:var(--text);font:400 13.5px 'Sora',sans-serif}
.wl-range i{font-style:normal;color:var(--muted)}
.wl-go{height:44px!important;min-width:96px;justify-content:center}
html[data-theme="light"] .wl-go{background:#040D3F!important;color:#fff!important}
.wl-test{display:flex;align-items:center;gap:8px;height:44px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.wl-test input{position:absolute;opacity:0;pointer-events:none}
.wl-test .sw{width:34px;height:20px;border-radius:999px;background:rgba(127,135,170,.35);position:relative;transition:background .2s}
.wl-test .sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.wl-test input:checked+.sw{background:#23E2A3}.wl-test input:checked+.sw::after{transform:translateX(14px)}
.wl-test input:focus-visible+.sw{outline:2px solid #7C5CFF;outline-offset:2px}
/* chip trạng thái theo giai đoạn: một hàng, cuộn ngang */
.wl-tabs-row{margin:0 0 12px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.wl-tabs{display:flex;align-items:center;gap:8px;width:max-content}
.wl-g{display:flex;align-items:center;gap:4px;padding:4px 6px 4px 10px;border-radius:999px;background:var(--wl-row);border:1px solid var(--wl-line)}
.wl-g em{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.wl-tab{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:0;background:transparent;color:var(--text);font:500 13px 'Sora',sans-serif;cursor:pointer;white-space:nowrap;transition:background .2s}
.wl-tab b{font-size:11.5px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;display:inline-grid;place-items:center;background:rgba(127,135,170,.22)}
.wl-tab:hover{background:var(--wl-hover)}
.wl-tab.z{color:var(--muted);opacity:.55}.wl-tab.z b{background:transparent}
.wl-tab.all{height:38px;padding:0 16px;background:var(--wl-row);border:1px solid var(--wl-line)}
.wl-tab.on{background:#fff!important;color:#040D3F!important;opacity:1}.wl-tab.on b{background:#040D3F;color:#fff}
html[data-theme="light"] .wl-tab.on{background:#040D3F!important;color:#fff!important}html[data-theme="light"] .wl-tab.on b{background:#fff;color:#040D3F}
/* công cụ */
.wl-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.wl-view{display:inline-flex;padding:4px;border-radius:999px;background:var(--wl-row);border:1px solid var(--wl-line)}
.wl-view button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--muted);font:500 13px 'Sora',sans-serif;cursor:pointer}
.wl-view button.on{background:#fff;color:#040D3F}html[data-theme="light"] .wl-view button.on{background:#040D3F;color:#fff}
.wl-clear{border:0;background:rgba(255,108,106,.14);color:#FF8A9B;height:32px;padding:0 12px;border-radius:999px;font:600 12.5px 'Sora',sans-serif;cursor:pointer}
html[data-theme="light"] .wl-clear{color:#C22B45;background:#FFE9EC}
.wl-tools .v10-pill.sm{height:38px;padding:0 16px;font-size:13px;gap:8px}
/* bảng */
.wl-card0{padding:0!important;overflow:hidden;border-radius:16px!important}
.wl-tw{max-height:calc(100vh - 210px);overflow:auto}
.wl-t{width:100%;border-collapse:separate;border-spacing:0}
.wl-t thead th{position:sticky;top:0;z-index:2;background:var(--surface,#0F1A4F);font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:14px 12px;border-bottom:1px solid var(--wl-line);white-space:nowrap;cursor:pointer;text-align:left}
html[data-theme="dark"] .wl-t thead th{background:#111A52}
.wl-t thead th.on{color:var(--text)}.wl-t thead th .sortic{margin-left:5px;font-style:normal;opacity:.6}
.wl-t thead th.pri,.wl-t thead th.act{cursor:default;width:6px;padding:0}
.wl-t td{padding:14px 12px;border-bottom:1px solid var(--wl-line);vertical-align:middle;font-size:13.5px}
.wl-t tbody tr{transition:background .15s}
.wl-t tbody tr.click{cursor:pointer}
.wl-t tbody tr:hover{background:var(--wl-hover)}
.wl-t td.pri{width:6px;padding:0 0 0 10px}.wl-t td.pri i{display:block;width:4px;height:38px;border-radius:4px}
.p-r{--pc:#FF5470}.p-y{--pc:#F8A13C}.p-i{--pc:#9F7AEA}.p-g{--pc:#23C38E}.p-n{--pc:#7D86B0}
.wl-t td.pri i{background:var(--pc)}
.wl-t td.no{white-space:nowrap}.wl-t td.no .mono{font-size:12.5px;color:#8FA4FF}
html[data-theme="light"] .wl-t td.no .mono{color:#3651D6}
.wl-demo{margin-left:6px;font-size:9px;font-weight:800;letter-spacing:.06em;padding:2px 5px;border-radius:4px;border:1px dashed rgba(159,122,234,.7);color:#B49BFF}
.wl-ins{display:flex;align-items:center;gap:10px;min-width:0}
.wl-ins b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap}
.wl-ins small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,#475484,#2D3657)}
.av.a-r{background:linear-gradient(135deg,#F55B46,#E42C66)}.av.a-y{background:linear-gradient(135deg,#E87205,#FFA114)}.av.a-i{background:linear-gradient(135deg,#7C5CFF,#4B2FC8)}.av.a-g{background:linear-gradient(135deg,#00828A,#005788)}
.av.s{width:26px;height:26px;font-size:10px;background:rgba(127,135,170,.3);color:var(--text)}
.av.s.sys{background:linear-gradient(135deg,#7C5CFF,#23E2A3);color:#fff}
.wl-epi{font-size:13px;color:var(--muted);white-space:nowrap}
.wl-st{display:flex;gap:6px;flex-wrap:wrap;align-items:center;max-width:430px}
.wl-more{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(127,135,170,.22);color:var(--text);cursor:help}
.wl-amt{font-size:14px;font-weight:600;white-space:nowrap}
.wl-age{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap}
.wl-age i{width:8px;height:8px;border-radius:50%;background:#23C38E;box-shadow:0 0 0 3px rgba(35,195,142,.18)}
.wl-age.y i{background:#F8A13C;box-shadow:0 0 0 3px rgba(248,161,60,.2)}.wl-age.n i{background:#7D86B0;box-shadow:none}
.wl-who{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:13px}
.wl-t td.act{width:44px;padding-right:14px}
.wl-t .go{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(127,135,170,.18);opacity:0;transform:translateX(-6px);transition:.2s}
.wl-t tr:hover .go{opacity:1;transform:none}
.wl-empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px;color:var(--muted)}
.wl-empty b{color:var(--text)}
/* nhãn trạng thái dịu hơn ở giao diện sáng (trước là khối màu đậm) */

html[data-theme="light"] .wl .badge-status.st-n{background:#EEF0F5!important;color:#535B74!important}
/* board theo giai đoạn */
.wl-board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:16px;overflow-x:auto;padding-bottom:6px}
.wl-col{background:var(--wl-row);border:1px solid var(--wl-line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:300px}

.wl-card{position:relative;padding:12px 12px 12px 16px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--wl-line);display:flex;flex-direction:column;gap:10px;transition:transform .2s,box-shadow .2s}
html[data-theme="light"] .wl-card{background:#fff;box-shadow:0 2px 6px rgba(4,13,63,.05)}
.wl-card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--pc)}
.wl-card.click{cursor:pointer}.wl-card.click:hover{transform:translateY(-3px);box-shadow:0 16px 30px -18px rgba(0,0,0,.6)}
.wl-card .h{display:flex;justify-content:space-between;align-items:center;font-size:12px}.wl-card .h .mono{color:#8FA4FF}

  const f=[]; const st=claimState(c);
  if(c.id==="B") f.push([t("Tự động duyệt","Auto-approved"),"g"]);
  if(c.id==="A"&&c.st.decision===null) f.push([t("Có đề xuất cần quyết","Proposal pending"),"i"]);

  if(c.id==="D") f.push([t("Thời gian chờ","Waiting period"),"r"]);
  return f;
};

function queueTable(keys, withStatic){
  const rows = keys.map(k=>{const c=CLAIMS[k]; const st=claimState(c); const a=ageTag(c);

  const stat = withStatic ? STATIC_Q.map(r=>`<tr><td class="req-id">${r.no}</td><td class="tmain"><b>${r.member}</b><div class="sub mono">${r.policy}</div></td><td>${r.episode}</td><td><div style="display:flex;gap:6px;flex-wrap:wrap">${tag(r.state, r.state.includes("chi trả")?"g":r.state.includes("Lỗi")?"r":"y")}${r.flags.map(f=>tag(f[0],f[1])).join("")}</div></td><td class="num">${r.amt?money(r.amt):"—"}</td><td><span class="pill" style="color:var(--${r.ageK==="g"?"ok":r.ageK==="y"?"warn":"muted"})">${r.age}</span></td><td>${r.who}</td></tr>`).join("") : "";
  const n = keys.length + (withStatic?STATIC_Q.length:0);
  const H = (lbl,cls="",dir="") => `<th class="${cls} sortable ${dir}" onclick="sortHint()">${lbl}<i class="sortic">${dir==="asc"?"▲":dir==="desc"?"▼":"⇅"}</i></th>`;
  return `<div class="table-wrap"><table>
    <thead><tr>
      ${H(t("Số hồ sơ","Claim no."),"","asc")}${H(t("Người được bảo hiểm","Insured"),"tmain")}${H(t("Loại điều trị","Treatment"))}${H(t("Trạng thái","Status"))}${H(t("Số tiền đề xuất","Proposed"),"num")}${H(t("Tuổi","Age"))}${H(t("Cán bộ","Assessor"))}
    </tr></thead>
    <tbody>${rows}${stat}</tbody></table></div>
    <div class="tfoot">
      <div class="tcount">1 – ${n} ${t("trên","of")} ${n} ${t("hồ sơ","items")}</div>
      <div class="tpage">
        <button class="pgb" disabled>${t("Trước","Prev")}</button>
        <button class="pgb on">1</button>
        <button class="pgb" onclick="sortHint()">2</button>

      </div>
    </div>`;
}

  const st=claimState(c);
  const idx = st==="UNDER_ASSESSMENT" ? 3 : st==="PENDING_APPROVAL" ? 4 : st==="APPROVED" ? 5 : (st==="PAID"||st==="DECLINED"||st==="CLOSED") ? 6 : 3;
  const names=[t("Khách gửi hồ sơ","Claim submitted"),t("Đọc & đối chiếu chứng từ","Documents read"),t("Thẩm định","Assessment"),t("Phê duyệt","Approval"),t("Chi trả & thông báo","Payment & notice")];
  return `<div class="procline">${names.map((n,i)=>{
    const k = i+1<idx ? "done" : i+1===idx ? "cur" : "todo";
    return `<div class="ps ${k}"><span class="pn">${k==="done"?"✓":i+1}</span><span class="pl">${n}</span></div>`;
  }).join("")}</div>`;
}

  if(c.id==="D"&&st==="UNDER_ASSESSMENT") L.push({k:"do",t:t("Xác nhận từ chối theo Điều 5.2 (thời gian chờ nha khoa) và trình người duyệt","Confirm the decline under Clause 5.2 (dental waiting period) and submit"),go:"events"});
  if(c.id==="A"&&c.st.decision!==null&&!c.st.submitted) L.push({k:"do",t:t("Gửi phê duyệt — phương án đã đủ điều kiện","Submit for approval — the plan is ready"),go:"settle"});
  if(c.id==="C"&&c.st.ack&&!c.st.submitted) L.push({k:"do",t:t("Gửi phê duyệt","Submit for approval"),go:"settle"});

   v7.0 DESIGN UPGRADE (03/10/2026) — đặc tả từng mục: 00-v7-design-upgrade.md

S.v7 = { scanned:{}, story:false, step:0 };
const SPARK = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9z"/><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z"/></svg>`;
const PERSON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>`;

/* ---------- D2 · Thẻ "AI đã làm gì cho hồ sơ này" ---------- */
function v7AiSteps(c){
  const g=gate(c), gOk=g.filter(x=>x.ok).length, p=P(c);
  const s=[
    {ic:"file",  n:t("Đọc chứng từ","Read documents"),       who:"BnK IDP", out:t(`${c.files} chứng từ · ${c.lines.length} dòng chi phí`,`${c.files} documents · ${c.lines.length} cost lines`), ms:"12,4 s", st:"done"},
    {ic:"stetho",n:t("Kiểm tra y khoa","Clinical check"),     who:t("BnK IDP · luồng thẩm định","BnK IDP · assessment flow"), out: c.id==="C"?t("PARTIAL · 3/6 dòng","PARTIAL · 3/6 lines"):c.id==="A"?t("Đề xuất cho dòng 4","Proposal on line 4"):t("Không có đề xuất","No proposal"), ms:"", st:c.id==="C"?"run":"done"},
    {ic:"calc",  n:t("Chuỗi 14 bước","14-step chain"),        who:t("Hệ thống · AG-2 giải thích","System · explained by AG-2"), out: c.id==="D"?t("Dừng ở bước 2 · WAIT","Stopped at step 2 · WAIT"):money(p.payable), ms:"", st:c.id==="C"?"todo":"done"},
    {ic:"gate",  n:t("Cổng tự duyệt","Auto-approval gate"),   who:t("Hệ thống","System"), out:`${gOk}/4 ${t("điều kiện đạt","conditions met")}`, ms:"", st:c.id==="C"?"todo":gOk===4?"done":"bad"},
    {ic:"check", n:t("Quyết định","Decision"),                who:gOk===4?t("Không cần người","No human needed"):t("Cán bộ thẩm định","Assessor"), out:c.id==="B"?t("Đã chi trả","Paid"):recOpen(c)?t("Chờ bạn quyết dòng 4","Waiting for you on line 4"):c.st.submitted?t("Đã trình phê duyệt","Submitted for approval"):c.st.decision?(c.st.decision==="confirm"?t("Đã xác nhận dòng 4","Line 4 confirmed"):t("Đã bác bỏ dòng 4","Line 4 rejected")):t("Chờ bạn","Waiting for you"), ms:"", st:(c.id==="B"||c.st.submitted)?"done":"todo", human:true}
  ];
  return s;
}
function v7AiCard(c){

/* ---------- D3 · Thác tiền (waterfall) ---------- */
function v7Waterfall(c){
  const p=P(c), D=c.id==="D", cf=confirmed(c);
  const steps=[{k:"start",l:t("Khách yêu cầu","Claimed"),v:c.total}];
  if(D) steps.push({k:"neg",l:t("Chưa qua thời gian chờ","Waiting period"),v:c.total,why:t("Nha khoa chờ 90 ngày — sự kiện ở ngày thứ 19","Dental waits 90 days — event on day 19"),ic:"clock"});
  else {
    if(p.cut6>0) steps.push({k:"neg",l:t("Không liên quan chẩn đoán","Not related to diagnosis"),v:p.cut6,why:t("Atorvastatin 20mg không liên quan đến chẩn đoán trên chứng từ","Atorvastatin 20mg is not related to the diagnosis on the documents"),ic:"stetho",human:true});
    if(p.cut8>0) steps.push({k:"neg",l:t("Vượt trần mỗi lần khám","Over per-visit cap"),v:p.cut8,why:t("Phần vượt trần 1.500.000 ₫ mỗi lần khám của quyền lợi 200.1","Above the 1,500,000 ₫ per-visit cap of benefit 200.1"),ic:"gate"});
    if(p.copay>0) steps.push({k:"neg",l:t("Đồng chi trả 20%","20% co-payment"),v:p.copay,why:t("Đồng chi trả 20% theo hợp đồng","20% co-payment under the policy"),ic:"wallet"});
  }
  steps.push({k:"end",l:t("Chi trả","Payable"),v:p.payable});
  const W=960,H=250,top=26,bot=46,ch=H-top-bot, max=c.total||1, n=steps.length, gap=44, bw=Math.min(150,(W-gap*(n+1))/n), x0=(W-(n*bw+(n-1)*gap))/2;
  const y=v=>top+ch-(v/max)*ch;
  let run=c.total, bars="";
  steps.forEach((s,i)=>{
    const x=x0+i*(bw+gap); let y0,y1,fill,cls="wfbar";
    if(s.k==="start"){ y0=y(s.v); y1=y(0); fill="#9AA9B8"; }
    else if(s.k==="end"){ y0=y(s.v); y1=y(0); fill="url(#v7end)"; }
    else { y0=y(run); run-=s.v; y1=y(run); fill="url(#v7neg)"; cls+=" neg"; }
    const h=Math.max(2,y1-y0), d=(0.12*i).toFixed(2);
    bars+=`<rect class="${cls}" x="${x}" y="${y0}" width="${bw}" height="${h}" rx="6" fill="${fill}" style="animation-delay:${d}s"/>`;
    if(i<n-1){ const nx=x+bw, ny=s.k==="neg"?y1:y0; bars+=`<line x1="${nx}" y1="${ny}" x2="${nx+gap}" y2="${ny}" stroke="var(--border-strong)" stroke-dasharray="3 3"/>`; }
    bars+=`<text class="val ${s.k==="neg"?"neg":""}" x="${x+bw/2}" y="${y0-8}" text-anchor="middle">${s.k==="neg"?"−":""}${vnd(s.v)}</text>`;
    const words=s.l.split(" "); const half=s.l.length>15?Math.ceil(words.length/2):words.length;
    bars+=`<text class="lbl" x="${x+bw/2}" y="${H-bot+18}" text-anchor="middle">${words.slice(0,half).join(" ")}</text><text class="lbl" x="${x+bw/2}" y="${H-bot+32}" text-anchor="middle">${words.slice(half).join(" ")}</text>`;
  });
  const reasons=steps.filter(s=>s.k==="neg");
  return `<div class="card v7-wf" id="v7-wf">
    <div class="v7-wf-h"><div><h3 class="h">${t("Số tiền được tính ra sao","How the amount was calculated")}</h3>
      <div class="sub">${t("Mỗi cột là một bước của chuỗi 14 bước có làm đổi tiền","Each bar is a chain step that changed the amount")}</div></div>
      <span class="sp" style="flex:1"></span>
      <div style="text-align:right"><div class="sub">${t("Đề xuất chi trả","Proposed payable")}</div><div class="v7-big" style="color:var(--${D?"danger":"text"})">${v7count(p.payable)}</div>
        ${c.id==="A"&&cf?`<div class="v7-delta">−120.000 ₫ ${t("so với lần tính trước","vs. previous run")}</div>`:""}
        ${recOpen(c)?`<div class="v7-delta" style="background:var(--ai-tint);color:var(--ai-ink)">${t("Đang chờ bạn quyết dòng 4","Waiting for your call on line 4")}</div>`:""}</div></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("Biểu đồ thác tiền","Payout waterfall")}">
      <defs><linearGradient id="v7neg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#E86464"/><stop offset="1" stop-color="#D33A3A"/></linearGradient>
      <linearGradient id="v7end" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#35D3A3"/><stop offset="1" stop-color="#0F8A86"/></linearGradient></defs>
      ${[0,.25,.5,.75,1].map(f=>`<line class="grid-l" x1="${x0-16}" x2="${W-x0+16}" y1="${y(max*f)}" y2="${y(max*f)}"/>`).join("")}
      ${bars}
    </svg>
    <div class="v7-reasons">${reasons.map(r=>`<div class="v7-reason"><div class="ri">${ic(r.ic,16)}</div><div><b>−${money(r.v)}</b>${r.why}${r.human?`<div style="margin-top:6px">${aiChip(t("AI đề xuất","AI proposed"))} ${humanChip(cf?t("Cán bộ đã xác nhận","Officer confirmed"):t("Chờ cán bộ","Awaiting officer"))}</div>`:""}</div></div>`).join("")}</div>
  </div>`;
}
const _v7calc = paneCalc;
paneCalc = function(c){
  return v7Waterfall(c)+`<details class="v7-tech"><summary>${ic("list",16)} ${t("Xem chuỗi 14 bước & sổ hạn mức (chi tiết kỹ thuật)","See the 14-step chain & limit ledger (technical detail)")}</summary>${_v7calc(c)}</details>`;

/* ---------- D4 · AI đọc chứng từ + D1 thẻ đề xuất ---------- */
const _v7costs = paneCosts;
paneCosts = function(c){
  const first=!S.v7.scanned[c.id]; S.v7.scanned[c.id]=true;
  let h=_v7costs(c);

  h=h.replace('class="rec-card','class="rec-card ai-surface');
  const recT=t("Đề xuất từ kiểm tra y khoa — dòng 4","Proposal from the clinical check — line 4")+"</b>";
  h=h.replace(recT, recT+" "+aiChip(t("AI đề xuất · BnK IDP","AI proposal · BnK IDP")));
  h=h.replace(`<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn btn-ok"`,
    `<div class="human-row">${humanChip(t("Bạn quyết định — số tiền chỉ đổi khi bạn xác nhận","You decide — money changes only when you confirm"))}</div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn btn-ok"`);
  return `<div class="v7-costs ${first?"scan":""}">${h}</div>`;
};

/* ---------- D5 · Biên lai kết quả cho khách ---------- */
function v7Donut(pay,bear){
  const tot=(pay+bear)||1, r=46, C=2*Math.PI*r, a=C*pay/tot;
  return `<svg class="v7-donut" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--border)" stroke-width="14"/>

function v7CountUp(){

    el.dataset.done="1"; const to=Number(el.dataset.to)||0, suf=el.dataset.suf||"", t0=performance.now(), dur=700;
    if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent=vnd(to)+suf; return; }
    const step=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=vnd(Math.round(to*e/1000)*1000)+suf; if(k<1) requestAnimationFrame(step); else el.textContent=vnd(to)+suf; };
    requestAnimationFrame(step);
  });
}

/* ---------- Trạng thái hồ sơ ---------- */
claimState = function(c){
  if(c.id==="B") return "PAID";
  if(c.id==="E"){ if(c.st.cleared) return "PAID"; if(c.st.infoReq) return "PENDING_INFO"; return "UNDER_ASSESSMENT"; }
  if(c.id==="F"){ return c.st.supp ? "PAID" : "PENDING_INFO"; }
  if(c.id==="D") return c.st.paid ? "CLOSED" : c.st.approved ? "DECLINED" : c.st.submitted ? "PENDING_APPROVAL" : "UNDER_ASSESSMENT";
  if(c.st.paid) return "PAID";
  if(c.st.approved) return "APPROVED";
  if(c.st.submitted) return "PENDING_APPROVAL";
  return "UNDER_ASSESSMENT";
};
const autoPaid = c => c.id==="B" || (!!c.dupFlow&&c.st.cleared) || (c.id==="F"&&c.st.supp);

/* ---------- Cổng 4 điều kiện — đúng câu chữ hệ thống thật ---------- */
gate = function(c){
  const p=P(c), a=c.assess, waitingDocs = c.id==="F"&&!c.st.supp;
  const chainDeclined = c.id==="D";
  const cut = (p.cut6>0) || (p.cut8>0) || (c.id==="A"&&confirmed(c));
  const clean = a.state==="COMPLETE" && a.linesAssessed.length===c.lines.length && a.recs===0;
  const os=openSigs(c);
  return [
    {ok: !waitingDocs && !chainDeclined && !cut && p.payable<=2000000, t:t("Chi trả ≤ 2.000.000 ₫ và không khoản nào bị cắt","Payable ≤ 2,000,000 ₫ and nothing cut"),
     why: waitingDocs ? t("Chưa chạy chuỗi — đang chờ chứng từ bắt buộc","Chain not run — waiting for mandatory documents")
        : chainDeclined ? t("Chuỗi tính từ chối toàn hồ sơ ở bước Kiểm tra kỳ chờ — quyết định từ chối luôn cần người duyệt","The chain declines the whole claim at the waiting-period step — a decline always needs an approver")
        : cut ? t(`Trần mỗi lần khám 200.1 chạm ở bước 8 (cắt ${vnd(p.cut8)} ₫)`+(confirmed(c)?" · dòng 4 bị loại":""),`Per-visit cap 200.1 bound at step 8 (${vnd(p.cut8)} ₫ cut)`+(confirmed(c)?" · line 4 excluded":""))
        : t(`${vnd(p.payable)} ₫ ≤ ngưỡng · chỉ có đồng chi trả (bước 10–11, không tính là cắt)`,`${vnd(p.payable)} ₫ ≤ threshold · co-pay only (steps 10–11, not counted as a cut)`)},
    {ok: !waitingDocs && clean, t:t("Đánh giá lâm sàng xong, không còn đề xuất","Clinical assessment complete, no proposal left"),
     why: waitingDocs ? t("Chưa đánh giá — chờ đủ chứng từ","Not assessed yet — waiting for documents")
        : a.state==="PARTIAL" ? t("PARTIAL — mới đánh giá 3/6 dòng; chưa phải hồ sơ sạch","PARTIAL — only 3/6 lines assessed; not a clean claim")
        : a.recs ? t("1 đề xuất NOTREL đang chờ cán bộ","1 NOTREL proposal awaiting an officer")
        : t(`COMPLETE · ${a.linesAssessed.length}/${c.lines.length} dòng · thẩm định IDP xong · không đề xuất`,`COMPLETE · ${a.linesAssessed.length}/${c.lines.length} lines · IDP assessment done · no proposal`)},
    {ok: c.id!=="D", t:t("Không còn điểm kiểm điều khoản đang mở","No open term checkpoint"),
     why: c.id==="D" ? t("Điều 5.2 thời gian chờ — cần người duyệt","Clause 5.2 waiting period — approver needed") : t("Nhóm bệnh tự gán GEN · không bước nào tạm dừng","Condition class auto-assigned GEN · no step on hold")},
    {ok: !blocked(c) && !waitingDocs, t:t("Không có tín hiệu trùng lặp / bất thường đang mở (AG-4)","No open duplicate / anomaly signal (AG-4)"),
     why: waitingDocs ? t("AG-4 chạy sau khi đủ chứng từ","AG-4 runs once documents are complete")
        : os.length ? t(`${os.length} tín hiệu mở: `,`${os.length} open signal(s): `)+os.map(s=>`${s.type} (${s.sev})`).join(", ")
        : (c.id==="E"&&c.st.cleared) ? t("Tín hiệu DUPLICATE đã được cán bộ gỡ kèm lý do","DUPLICATE signal cleared by an officer with a reason")
        : t("AG-4 đã kiểm · ngày hợp lệ · không hồ sơ trùng · cơ sở khớp danh mục IDP","AG-4 checked · dates valid · no duplicate · provider matches the IDP catalogue")}
  ];
};

const lowLines = c => c.lines.filter(l=>l.conf<.75);
function lowDone(c){ return !!c.st.ack || lowLines(c).every(l=>c.st.ver[l.no]); }
function verifyLine(no){ const c=cur(); if(c.st.ver[no]) delete c.st.ver[no]; else c.st.ver[no]={by:"Nguyễn Hoài An",at:nowHM()};
  if(lowLines(c).length && lowLines(c).every(l=>c.st.ver[l.no])) { c.st.ack=true; toast(t("Đã xác minh đủ dòng độ tin cậy thấp — có thể gửi phê duyệt","All low-confidence lines verified — ready to submit")); }
  else if(c.st.ack && lowLines(c).some(l=>!c.st.ver[l.no])) c.st.ack=false;
  render(); }

const LOSS8 = () => ({OP:{l:t("Bệnh — ngoại trú","Illness — outpatient"),d:[["STMT","M"],["INV","M"],["EXAM","M"],["RX","S"],["LAB","S"]]},
  DEN:{l:t("Nha khoa","Dental"),d:[["STMT","M"],["INV","M"],["DENT","M"],["XRAY","S"]]},
  IP:{l:t("Bệnh — nội trú","Illness — inpatient"),d:[["DIS","M"],["STMT","M"],["INV","M"],["RX","S"]]},
  ACC:{l:t("Tai nạn","Accident"),d:[["ACC","M"],["STMT","M"],["INV","M"],["EXAM","M"]]}});
function a7Missing(A){ return LOSS8()[A.loss].d.filter(([k,lv])=>lv==="M"&&(!A.files[k]||A.files[k].pending||A.files[k].idp!==k)).map(([k])=>k); }
function a7Up(ctx,k){ const A=S.v8[ctx]; const first=!A.tries[k]; A.tries[k]=(A.tries[k]||0)+1;
  const idp=(k==="INV"&&first&&ctx==="a7")?"RX":k;   /* lần đầu tải nhầm đơn thuốc vào ô Hoá đơn → IDP nhắc ngay */
  const f={n:1,idp,pending:true,t0:performance.now()}; A.files[k]=f; render(); a7Clock();
  setTimeout(()=>{ if(A.files[k]===f){ f.pending=false; render(); } },IDP_READ_S/AI_SPEED*1000); }
const IDP_READ_S = 25;   /* BnK IDP đọc 1 tệp ≈ 25 s (đo trên tenant) */
let _a7clk=null;
function a7Clock(){ if(_a7clk) return; _a7clk=setInterval(()=>{ const L=document.querySelectorAll(".a7-cnt[data-t0]"); if(!L.length){ clearInterval(_a7clk); _a7clk=null; return; }
  L.forEach(el=>{ const s=Math.min(IDP_READ_S,(performance.now()-Number(el.dataset.t0))/1000*AI_SPEED); el.textContent=fmtS(s)+" / ~"+IDP_READ_S+" s"; }); },200); }
function a7Move(ctx,k){ const A=S.v8[ctx], f=A.files[k]; delete A.files[k]; A.files[f.idp]={n:f.n,idp:f.idp}; render(); toast(t(`Đã chuyển tệp sang ô ${DOCT()[f.idp]}`,`File moved to ${DOCT()[f.idp]}`)); }
function a7List(ctx){ const A=S.v8[ctx], N=DOCT();
  const rows=LOSS8()[A.loss].d.map(([k,lv])=>{ const f=A.files[k], M=lv==="M"; let cls, status, act="";
    if(!f){ cls=M?"miss":"opt"; status=M?`<span class="a7-miss-t">${t("Còn thiếu","Missing")}</span>`:`<span class="sub">${t("chưa có · không bắt buộc","none yet · not required")}</span>`; act=`<button class="btn ${M?"btn-primary":"btn-ghost"} btn-sm" onclick="a7Up('${ctx}','${k}')">${ic("camera",14)} ${t("Chụp / tải lên","Capture / upload")}</button>`; }
    else if(f.pending){ cls="pend"; status=`<span class="a7-lbl"><span class="spin sm"></span> ${t("BnK IDP đang đọc tệp để nhận loại chứng từ","BnK IDP is reading the file to recognise its type")} · <b class="a7-cnt" data-t0="${f.t0}">0 s</b></span><div class="sub" style="margin-top:3px">${t("Bạn có thể chụp tiếp các ô khác trong lúc chờ.","You can capture the other slots while you wait.")}</div>`; }
    else if(f.idp!==k){ cls="mis"; status=`<span class="a7-lbl bad">${t("Bạn chọn","You chose")}: ${N[k]} · ${t("IDP nhận ra","IDP sees")}: ${N[f.idp]}</span><div class="a7-warn">${ic("warn",15)} <span>${t(`Tệp này giống <b>${N[f.idp]}</b>, không phải <b>${N[k]}</b>.`,`This file looks like a <b>${N[f.idp]}</b>, not a <b>${N[k]}</b>.`)}</span><button class="btn btn-primary btn-sm" onclick="a7Up('${ctx}','${k}')">${t("Chụp lại","Retake")}</button><button class="btn btn-ghost btn-sm" onclick="a7Move('${ctx}','${k}')">${t(`Chuyển sang ô ${N[f.idp]}`,`Move to ${N[f.idp]}`)}</button></div>`; }

    return `<div class="a7-row ${cls}"><div class="a7-ico">${ic(cls==="ok"?"check":cls==="miss"?"file":cls==="mis"?"warn":cls==="pend"?"refresh":"camera",18)}</div><div><b>${N[k]}</b> ${tag(M?t("Bắt buộc","Required"):t("Nên có","Recommended"),M?"r":"y")}<div style="margin-top:4px">${status}</div></div><div>${act}</div></div>`; }).join("");

    else if(s.ic==="file"||s.ic==="receipt"){ if(hasIntake){ k="idp"; sp=by("idp"); } else { const a=by("idp"),b=by("ag1"); k="read"; sp={s:a.s,d:b.s+b.d-a.s,warn:b.warn}; } }

  const sx = s.replace('<div style="flex:1">', `<div style="flex:1">`).replace(/(<span class="pill">|<span class="dec dec-(?:ok|pend)">)/, `<button class="btn btn-ghost btn-sm v9-pill" onclick="toast('${t("Đã chạy lại AG-4","AG-4 re-run")}')">${t("Chạy lại kiểm tra","Re-run check")}</button><button class="btn btn-ghost btn-sm v9-pill" onclick="toast('${t("Đã chạy đánh giá lâm sàng","Clinical assessment run")}')">${t("Chạy đánh giá lâm sàng","Run clinical assessment")}</button>$1`);

function v9CustLines(c){ const G=v9Groups(c), R={}; G.forEach(g=>g.rows.forEach(r=>R[r.l.no]=r)); return c.lines.map(l=>R[l.no]); }

  const head = done ? `<div class="a">${money(pay)}</div><div class="st">${dl?t("Không được chi trả lần này","Not payable this time"):st==="PAID"?t("Đã chi trả","Paid"):t("Đã duyệt — đang chi trả","Approved — paying")} · ${d}</div>`
    : `<div class="a">${t("Chưa có kết quả","No result yet")}</div><div class="st">${pend?t("Chờ bổ sung chứng từ","Waiting for documents"):t("Đang chờ thẩm định","Pending assessment")}</div>`;
  const steps=[[t("Đã gửi","Submitted"),d,"done"],[t("Đọc chứng từ","Reading documents"),`${t("Đã đọc","Read")}: ${c.files||DOCS[c.id].length} ${t("chứng từ","documents")} · ${c.lines.length} ${t("dòng chi phí","cost lines")}`,done?"done":pend?"curg":"done"],[t("Thẩm định","Assessment"),done?(bear>0&&!dl?t("Một phần không được chi trả","Partly not covered"):""):"",done?"done":pend?"cur":"curg"],[t("Quyết định","Decision"),"",done?"done":""]];
  const trk=`<div class="v9-trk">${steps.map((s,i)=>`<div class="s ${s[2]}"><i>${s[2]==="done"?"✓":i+1}</i><b>${s[0]}</b><small class="${i===2&&done?"w":""}">${s[1]}</small></div>`).join("")}</div>`;
  const body = done ? `<div class="v7-split">${v7Donut(pay,bear)}<div class="v7-legend"><div><i style="background:#35D3A3"></i>${t("Bảo hiểm chi trả","Insurer pays")}<b>${money(pay)}</b></div><div><i style="background:var(--border)"></i>${t("Bạn tự chịu","You bear")}<b>${money(bear)}</b></div><div style="border-top:1px solid var(--border);padding-top:8px"><span class="sub">${t("Tổng chi phí","Total cost")}</span><b>${money(lineSum(c))}</b></div></div></div>`

  const acts = `<div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">${done?`<button class="btn btn-ghost btn-sm v9-pill" onclick="toast('${t("Đang tải thư kết quả (PDF)","Downloading the result letter (PDF)")}')">${ic("download",14)} ${t("Tải thư kết quả","Download result letter")}</button>`:`<button class="btn btn-ghost btn-sm v9-pill" onclick="go('supplement')">${t("Bổ sung thông tin","Add information")}</button>`}<button class="btn btn-sm v9-pill" style="background:var(--ai-grad);color:#fff;border:0" onclick="S.chat=true;render()">${SPARK.replace('<svg','<svg width="14" height="14"')} ${t("Hỏi trợ lý về hồ sơ này","Ask assistant about this claim")}</button></div>

        : `<div class="v9-item"><span class="n">${esc(l.name)}</span><span style="text-align:right"><b class="g">${money(l.amt)}</b><div class="why">${t("đang thẩm định","under assessment")}</div></span></div>`; }).join("")}</div>`;
  const G=v9Groups(c), cop=G.reduce((n,g)=>n+g.co,0), ov=G.reduce((n,g)=>n+g.over,0), ex=(c.rec&&confirmed(c))?recLine(c):null;
  const right = pend ? `<div class="card card-pad v9-need"><h3 class="h" style="margin:0">${t("Chúng tôi cần thêm vài chứng từ","We need a few more documents")}</h3><div class="sub">${t("Yêu cầu ngày","Requested on")} ${d}</div>
        <div class="v9-need doc" style="border:0;background:transparent"><span>${t("Phiếu khám bệnh","Examination record")}</span>${tag(t("Bắt buộc","Required"),"r")}</div>

function v10Count(){ document.querySelectorAll("[data-count]").forEach(el=>{ if(el.dataset.done) return; el.dataset.done=1; const to=Number(el.dataset.count), t0=performance.now(), dur=1200;
  const step=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=Math.round(to*e).toLocaleString(S.lang==="en"?"en-US":"vi-VN"); if(k<1) requestAnimationFrame(step); }; requestAnimationFrame(step); }); }
const _r10 = render;
render = function(){ _r10(); try{ v10Count(); }catch(e){} };
