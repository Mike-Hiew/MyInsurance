<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<title>Nền tảng Bảo hiểm Sức khoẻ Số — MVP 1 · Prototype v6.1</title>
<style>
/* =========================================================
   Agentic Health Claim — Interactive Prototype v5.0
   Same design system as My Insurance Portal / Backoffice prototypes
   => one product family. Two apps in one file:
     · Claim Backoffice  (cán bộ thẩm định / người duyệt)
     · Customer Portal   (khách hàng)
   Content: MVP1 J2 + Agent Workbench orchestration + real BnK IDP API.
   Scenarios = the 4 claims in the queue (B clean · A recommendation ·
   C assessment broke · D full decline).
   ========================================================= */
:root{
  --brand:#ED4C2F; --primary:#1E6FEB; --primary-600:#1657c4; --primary-tint:#e8f0fe;
  --ok:#1F9D57; --ok-tint:#e4f5ec; --warn:#C77700; --warn-tint:#fbf0dc;
  --danger:#D33A3A; --danger-tint:#fbe6e6; --info:#6236C7; --info-tint:#efe9fb;
  --teal:#0F8A86; --teal-tint:#e3f4f3;
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#FAFBFD;
  --text:#1B2129; --muted:#6E7787; --faint:#9AA2AE;
  --border:#E4E7EC; --border-strong:#D4D9E0;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);
  --shadow-lg:0 8px 24px rgba(16,24,40,.12);
  --radius:12px; --radius-sm:8px;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --primary:#4E8CF5; --primary-600:#3d78e0; --primary-tint:#17263f;
  --ok:#37B26C; --ok-tint:#13291d; --warn:#E0A24A; --warn-tint:#2b2314;
  --danger:#E86464; --danger-tint:#2c1717; --info:#9B7BE8; --info-tint:#211a34;
  --teal:#3BB8B3; --teal-tint:#132b2a;
  --bg:#0F131A; --surface:#171C24; --surface-2:#1D232C;
  --text:#E6EAF0; --muted:#98A2B0; --faint:#6B7482;
  --border:#2A313B; --border-strong:#39424E;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button{font-family:inherit;cursor:pointer}
a{color:var(--primary);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:2px solid var(--bg)}
svg.ic,svg.i{width:18px;height:18px;flex-shrink:0}

.app{display:grid;grid-template-columns:248px 1fr;height:100vh}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px;border-bottom:1px solid var(--border)}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1E6FEB,#4E8CF5);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex-shrink:0}
.brand .logo.cust{background:linear-gradient(135deg,#0F8A86,#3BB8B3)}
.brand .name{font-weight:700;font-size:14px;line-height:1.15}
.brand .name small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.nav{padding:12px 10px;flex:1;overflow-y:auto}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 12px 7px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:10px;color:var(--text);font-weight:500;border:none;background:none;width:100%;text-align:left;font-size:13.5px;transition:.15s;position:relative}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--primary-tint);color:var(--primary);font-weight:700;box-shadow:inset 3px 0 0 var(--primary)}
.ni-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;transition:.15s}
.ni-ic svg{width:17px;height:17px}
.nav-item:hover .ni-ic{transform:translateY(-1px)}
.nav-item.active .ni-ic{box-shadow:0 0 0 1.5px currentColor}
.nav-item .badge{margin-left:auto;background:var(--warn);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px}
.nav-item .badge.red{background:var(--danger)}.nav-item .badge.blue{background:var(--primary)}
.sidebar-foot{border-top:1px solid var(--border);padding:12px}
.userbox{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius-sm)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--info-tint);color:var(--info);display:grid;place-items:center;font-weight:700;flex-shrink:0}
.userbox .u-name{font-weight:600;font-size:13px}.userbox .u-role{color:var(--muted);font-size:11.5px}
.role-switch{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;margin:0 0 8px}
.role-switch button{flex:1;border:0;background:none;padding:7px 6px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted)}
.role-switch button.on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}

.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.page-title{font-size:18px;font-weight:700}
.page-sub{color:var(--muted);font-size:12.5px;margin-top:1px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:7px 14px;width:220px;color:var(--muted)}
.search input{border:none;background:none;outline:none;color:var(--text);width:100%;font-size:13px}
.icon-btn{min-width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:grid;place-items:center;transition:.15s;position:relative;padding:0 8px;font-weight:700;font-size:12px}
.icon-btn:hover{color:var(--text);border-color:var(--border-strong)}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:7px;height:7px;background:var(--danger);border-radius:50%;border:2px solid var(--surface)}
.content{padding:24px;overflow-y:auto;flex:1}
.screen{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:var(--radius-sm);font-weight:600;font-size:13.5px;border:1px solid transparent;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-600)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text)}.btn-ghost:hover{border-color:var(--border-strong);background:var(--surface-2)}
.btn-ok{background:var(--ok);color:#fff}.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 12px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.grid{display:grid;gap:16px}.grid>*{min-width:0}.two-col>*{min-width:0}.kpis{grid-template-columns:repeat(4,1fr)}.kpis3{grid-template-columns:repeat(3,1fr)}
.kpi{padding:18px}.kpi .k-top{display:flex;align-items:center;justify-content:space-between}
.kpi .k-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.kpi .k-val{font-size:28px;font-weight:800;margin-top:12px;letter-spacing:-.02em}
.kpi .k-lbl{color:var(--muted);font-size:12.5px;margin-top:2px}
.kpi .k-trend{font-size:12px;font-weight:600;margin-top:8px;display:inline-flex;gap:4px;align-items:center}
.trend-up{color:var(--ok)}.trend-down{color:var(--danger)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px}
.section-head h3{margin:0;font-size:15px;font-weight:700}
.section-head .lnk{color:var(--primary);font-weight:600;font-size:12.5px;background:none;border:none}
h3.h{margin:0 0 6px;font-size:14px}
.sub{color:var(--muted);font-size:12px}

.chart{display:flex;align-items:flex-end;gap:14px;height:180px;padding:10px 4px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bar-stack{width:100%;max-width:34px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;height:100%}
.bar{width:100%;border-radius:5px 5px 0 0;transition:.6s cubic-bezier(.2,.8,.2,1)}
.bar.a{background:var(--primary)}.bar.b{background:var(--info)}
.bar-x{font-size:11px;color:var(--muted);font-weight:600}
.legend{display:flex;gap:16px;margin-top:6px}.legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:#fff;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:11px 14px;background:linear-gradient(180deg,var(--primary),var(--primary-600));border-bottom:none;white-space:nowrap}
th.num{color:#fff}
thead th:first-child{border-top-left-radius:9px;border-bottom-left-radius:0}
thead th:last-child{border-top-right-radius:9px;border-bottom-right-radius:0}
thead tr{box-shadow:var(--shadow)}
td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{transition:.12s}tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;white-space:nowrap}
.req-id{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.mono{font-family:var(--mono);font-size:12px}
.person{display:flex;align-items:center;gap:10px}.person .avatar{width:30px;height:30px;font-size:12px}

.badge-status{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.badge-status::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.st-n{background:var(--surface-2);color:var(--faint)}
.st-b{background:var(--primary-tint);color:var(--primary)}
.st-i{background:var(--info-tint);color:var(--info)}
.st-y{background:var(--warn-tint);color:var(--warn)}
.st-g{background:var(--ok-tint);color:var(--ok)}
.st-r{background:var(--danger-tint);color:var(--danger)}
.pill{display:inline-block;padding:3px 10px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.risk{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700}
.risk::before{content:'';width:8px;height:8px;border-radius:2px;background:currentColor}
.risk-low{background:var(--ok-tint);color:var(--ok)}.risk-med{background:var(--warn-tint);color:var(--warn)}.risk-high{background:var(--danger-tint);color:var(--danger)}
.kind{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:5px;white-space:nowrap;vertical-align:1px}
.kind.kt{background:var(--primary-tint);color:var(--primary)}.kind.ka{background:var(--teal-tint);color:var(--teal)}.kind.ko{background:var(--info-tint);color:var(--info)}
.kind.kh{background:var(--warn-tint);color:var(--warn)}.kind.kd{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.conf{display:inline-block;min-width:34px;text-align:center;padding:2px 6px;border-radius:5px;font-size:11.5px;font-weight:700}
.conf.g{background:var(--ok-tint);color:var(--ok)}.conf.y{background:var(--warn-tint);color:var(--warn)}.conf.r{background:var(--danger-tint);color:var(--danger)}

.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.select,.input{padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;outline:none;font-family:inherit}
.select:focus,.input:focus{border-color:var(--primary)}
.field{margin-bottom:16px}.field label{display:block;font-weight:600;font-size:12.5px;margin-bottom:6px}
.field .input,.field .select,.field textarea{width:100%}
textarea{padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;outline:none;resize:vertical;font-family:inherit}

.login-wrap{min-height:100vh;display:grid;place-items:center;background:radial-gradient(1200px 500px at 80% -10%,var(--primary-tint),transparent),var(--bg);padding:20px}
.login-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);padding:34px}
.login-card .brand{border:none;padding:0;justify-content:center;margin-bottom:6px}
.login-card h2{text-align:center;margin:14px 0 4px;font-size:20px}
.login-card p.sub{text-align:center;color:var(--muted);margin:0 0 24px;font-size:13px}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.role-pick button{border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:12px;text-align:left;font-size:13px}
.role-pick button b{display:block;font-size:13.5px}.role-pick button small{color:var(--muted)}
.role-pick button.on{border-color:var(--primary);background:var(--primary-tint)}

/* agent cards */
.agent-dec{display:flex;gap:12px;padding:14px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;background:var(--surface)}
.agent-dec .a-ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--info-tint);color:var(--info);flex-shrink:0}
.agent-dec .a-ic.tool{background:var(--primary-tint);color:var(--primary)}.agent-dec .a-ic.agent{background:var(--teal-tint);color:var(--teal)}.agent-dec .a-ic.human{background:var(--warn-tint);color:var(--warn)}.agent-dec .a-ic.det{background:var(--surface-2);color:var(--muted)}
.agent-dec .a-name{font-weight:700;font-size:13.5px}
.agent-dec .a-desc{color:var(--muted);font-size:12px;margin-top:2px}
.agent-dec .a-verdict{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dec{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:5px}
.dec-ok{background:var(--ok-tint);color:var(--ok)}.dec-rej{background:var(--danger-tint);color:var(--danger)}.dec-info{background:var(--warn-tint);color:var(--warn)}.dec-pend{background:var(--surface-2);color:var(--faint)}.dec-blue{background:var(--primary-tint);color:var(--primary)}

.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.detail-grid>*{min-width:0}
.detail-grid.collapsed{grid-template-columns:1fr}
.detail-grid.collapsed .ai-panel{display:none}
.ai-panel{position:sticky;top:0}
.rec-card{border:1px solid var(--primary);background:var(--primary-tint);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.rec-card.ok{border-color:var(--ok);background:var(--ok-tint)}.rec-card.warn{border-color:var(--warn);background:var(--warn-tint)}.rec-card.bad{border-color:var(--danger);background:var(--danger-tint)}
.dl{display:grid;grid-template-columns:150px 1fr;gap:10px 12px;font-size:13px;margin:8px 0}
.dl dt{color:var(--muted)}.dl dd{margin:0;font-weight:600}
.doc-row{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-top:8px}
.doc-ic{width:34px;height:34px;border-radius:8px;background:var(--primary-tint);color:var(--primary);display:grid;place-items:center;flex-shrink:0}
.timeline{border-left:2px solid var(--border);margin-left:8px;padding-left:16px}
.tl-item{position:relative;padding-bottom:16px}
.tl-item::before{content:'';position:absolute;left:-23px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid var(--surface)}
.tl-item.ok::before{background:var(--ok)}.tl-item.warn::before{background:var(--warn)}.tl-item.bad::before{background:var(--danger)}.tl-item.na::before{background:var(--faint)}
.tl-item .t-t{font-weight:600;font-size:13px}.tl-item .t-m{color:var(--muted);font-size:12px}

.modal-overlay{position:fixed;inset:0;background:rgba(10,14,20,.5);display:none;place-items:center;z-index:50;padding:20px}
.modal-overlay.open{display:grid}
.modal{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);padding:24px;animation:pop .2s}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;bottom:32px}

.msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.45;margin-bottom:8px}
.msg.ai{background:var(--surface-2);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.user{background:var(--primary);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.chip{padding:5px 11px;border-radius:16px;border:1px solid var(--border);background:var(--surface-2);font-size:11.5px;color:var(--primary);font-weight:600;cursor:pointer}
.fab{position:fixed;right:26px;bottom:26px;width:54px;height:54px;border-radius:50%;background:var(--primary);color:#fff;border:0;display:grid;place-items:center;box-shadow:var(--shadow-lg);z-index:40}
.chatbox{position:fixed;right:26px;bottom:92px;width:360px;max-height:520px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);display:none;flex-direction:column;z-index:45;overflow:hidden}
.chatbox.open{display:flex}
.chatbox .ch-h{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-weight:700}
.chatbox .ch-b{padding:12px;overflow-y:auto;flex:1;display:flex;flex-direction:column}
.chatbox .ch-f{padding:10px;border-top:1px solid var(--border);display:flex;gap:8px}

.proto-banner{display:flex;align-items:center;gap:10px;background:var(--info-tint);color:var(--info);border-radius:var(--radius-sm);padding:10px 14px;font-size:12.5px;font-weight:600;margin-bottom:18px}
.note{display:flex;gap:10px;border:1px solid var(--border);border-left:4px solid var(--primary);background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 13px;font-size:12.5px;color:var(--text);margin:10px 0}
.note.g{border-left-color:var(--ok)}.note.y{border-left-color:var(--warn)}.note.r{border-left-color:var(--danger)}.note.i{border-left-color:var(--info)}
.note b{font-weight:700}
.two-col{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid2>*{min-width:0}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}.list-row:last-child{border:none}
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-weight:600;font-size:13px;background:none;border:none;margin-bottom:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 14px;font-weight:600;font-size:13px;color:var(--muted);border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab .cnt{background:var(--warn);color:#fff;font-size:10px;font-weight:700;padding:0 6px;border-radius:10px}
.hide{display:none!important}

/* wizard / stepper (portal) */
.wiz{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.wiz .w{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.wiz .w .n{width:26px;height:26px;border-radius:50%;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0}
.wiz .w.on{border-color:var(--primary);background:var(--primary-tint)}.wiz .w.on .n{background:var(--primary);color:#fff}
.wiz .w.done .n{background:var(--ok);color:#fff}
.wiz .w b{display:block;font-size:13px}.wiz .w small{color:var(--muted);font-size:11.5px}
.upload{border:2px dashed var(--border-strong);border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted);background:var(--surface-2)}
.upload b{color:var(--text)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.thumb{border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--surface);font-size:12px}
.thumb .ph{height:78px;border-radius:6px;background:linear-gradient(135deg,var(--surface-2),var(--border));margin-bottom:8px;display:grid;place-items:center;color:var(--faint);font-size:11px}
.pipe{display:flex;flex-direction:column;gap:8px}
.pipe .p{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface)}
.pipe .p .st{margin-left:auto}
.spin{width:16px;height:16px;border:2px solid var(--border-strong);border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.outcome{display:grid;grid-template-columns:1fr auto;gap:8px 14px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-top:8px;align-items:center}
.outcome .big{font-size:22px;font-weight:800}
.progress{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.progress i{display:block;height:100%;background:var(--primary)}
.stepline{display:flex;gap:0;margin:8px 0 4px}
.stepline .s{flex:1;text-align:center;font-size:11.5px;color:var(--muted);position:relative;padding-top:18px}
.stepline .s::before{content:'';position:absolute;top:4px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:var(--border-strong);border:2px solid var(--surface)}
.stepline .s::after{content:'';position:absolute;top:9px;left:50%;right:-50%;height:2px;background:var(--border)}
.stepline .s:last-child::after{display:none}
.stepline .s.done::before,.stepline .s.done::after{background:var(--ok)}
.stepline .s.cur::before{background:var(--primary)}.stepline .s.cur{color:var(--primary);font-weight:700}

/* agent map */
.lane{border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;background:var(--surface)}
.lane .lh{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:10px}
.lane.orch{border-color:var(--info);background:var(--info-tint)}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.agrid.one{grid-template-columns:1fr}
.ag{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--surface)}
.ag .ah{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.ag .aid{font-family:var(--mono);font-size:10px;color:var(--faint);font-weight:700}
.ag .an{font-size:13.5px;font-weight:700}
.ag .ak{font-size:12px;color:var(--muted);padding:5px 0;border-top:1px solid var(--border);margin-top:6px;line-height:1.45}
.ag .ak b{color:var(--text);font-weight:600}
.boundary{margin:14px 0;padding:12px 16px;border-radius:10px;background:var(--text);color:var(--bg);font-size:12.5px;display:flex;gap:10px;align-items:flex-start}
[data-theme="dark"] .boundary{background:#0b0f15;color:#cfd6e0;border:1px solid var(--border)}
.boundary b{color:var(--surface)}[data-theme="dark"] .boundary b{color:#fff}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dt{border:1px solid var(--border);border-radius:10px;padding:11px 12px;background:var(--surface-2)}
.dt .dn{font-weight:700;font-size:12.5px;display:flex;gap:6px;align-items:center}.dt .dd{font-size:11.5px;color:var(--muted);margin-top:3px}

pre.j{background:#0f1720;color:#d7e3ee;padding:13px 15px;border-radius:10px;overflow-x:auto;font-family:var(--mono);font-size:11.5px;line-height:1.55;margin:0;max-width:100%}
pre.j .k{color:#7fd3c8}pre.j .s{color:#e6c98a}pre.j .n{color:#f0a58a}pre.j .c{color:#7f93a3;font-style:italic}

.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kgrid.two{grid-template-columns:1fr 1fr}
.tile{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--surface)}
.tile .kv{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tile .kl{font-size:12px;color:var(--text);margin-top:4px;font-weight:600}
.tile .ks{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}
.tile.m .kv{color:var(--ok)}.tile.m{background:var(--ok-tint);border-color:transparent}
.tile.todo .kv{color:var(--danger)}.tile.todo{background:var(--danger-tint);border-color:transparent}
.tile.b{background:var(--surface-2)}
.tile.a .kv{color:var(--warn)}.tile.a{background:var(--warn-tint);border-color:transparent}

.gate{display:grid;gap:8px}
.gate .g{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface)}
.gate .g .ck{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-weight:800}
.gate .g.ok .ck{background:var(--ok-tint);color:var(--ok)}.gate .g.bad .ck{background:var(--danger-tint);color:var(--danger)}.gate .g.na .ck{background:var(--surface-2);color:var(--faint)}
.gate .g b{font-size:13px}.gate .g .why{font-size:12px;color:var(--muted);margin-top:2px}
.calc tr.cut td{color:var(--danger)}.calc tr.chg td{background:var(--warn-tint)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba .box{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--surface-2)}
.ba .box .t{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.ba .box .v{font-size:22px;font-weight:800;margin-top:4px}
.ba .box.after{border-color:var(--ok);background:var(--ok-tint)}
.ev{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--border);font-size:12.5px}
.ev .tag{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:26px;font-size:13px}
.empty b{display:block;color:var(--text);font-size:14px;margin-bottom:4px}

@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.detail-grid{grid-template-columns:1fr}.two-col,.grid2{grid-template-columns:1fr}.kgrid{grid-template-columns:1fr 1fr}.dgrid{grid-template-columns:1fr 1fr}.wiz{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{display:none}.kpis,.kgrid,.agrid,.dgrid,.wiz{grid-template-columns:1fr}}
.nav-item .fc{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint)}
.tab .fc{font-family:var(--mono);font-size:9.5px;color:var(--faint);font-weight:500}
.stepline .s .sub{font-weight:400}

/* ===== MODERN SKIN =====================================================
   Sidebar tối, top bar trắng, bảng phẳng, trạng thái pill đặc màu. */
body{font-family:'Inter','Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.page-title,.brand .name,h3.h,.section-head h3,.kpi .k-val,.tile .kv,.login-card h2,.ba .box .v,.outcome .big{font-family:'Manrope','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.01em}
.section-head h3{font-weight:800}
.kpi .k-val,.tile .kv{font-weight:800}

.app{grid-template-columns:264px 1fr}
.sidebar{background:radial-gradient(120% 70% at 0% 0%,#12454a 0%,#0c3036 45%,#082227 100%);border-right:none;position:relative}
.sidebar::after{content:'';position:absolute;inset:auto 0 0 0;height:46%;background:radial-gradient(100% 60% at 10% 100%,rgba(53,211,163,.13),transparent 70%);pointer-events:none}
.sidebar>*{position:relative;z-index:1}
.sidebar .brand{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
.sidebar .brand .name{color:#fff;font-weight:800}

.brand .logo{box-shadow:0 6px 16px rgba(0,0,0,.3)}
.nav{padding:14px 12px}
.nav-label{color:rgba(255,255,255,.42)}
.nav-item{color:rgba(255,255,255,.8);font-weight:500;border-radius:12px;padding:9px 12px}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff}
.nav-item.active{background:rgba(255,255,255,.13);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 #35d3a3}
.nav-item .fc{color:rgba(255,255,255,.32)}
.ni-ic{box-shadow:0 2px 6px rgba(0,0,0,.22)}
.nav-item.active .ni-ic{box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.sidebar-foot{border-top:1px solid rgba(255,255,255,.09)}
.userbox .u-name{color:#fff}
.userbox .u-role{color:rgba(255,255,255,.55)}
.role-switch{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14)}
.role-switch button{color:rgba(255,255,255,.72);border-radius:8px}
.role-switch button.on{background:#fff;color:#0c3036;box-shadow:none}

.topbar{padding:16px 28px}
.content{padding:24px 28px 40px}
.search{border-radius:999px;padding:9px 16px;width:250px}
.icon-btn{border-radius:50%;min-width:40px;height:40px}
.card{border:none;border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 8px 22px rgba(16,24,40,.05)}
[data-theme="dark"] .card{box-shadow:0 1px 2px rgba(0,0,0,.5)}

.btn{border-radius:999px;padding:10px 18px}
.btn-primary{background:#0c3036;color:#fff}
.btn-primary:hover{background:#0f4149}
[data-theme="dark"] .btn-primary{background:var(--primary)}
.btn-sm{padding:7px 14px}

.tabs{border-bottom:none;gap:8px;margin-bottom:18px}
.tab{border-radius:999px;background:var(--surface-2);border:1px solid var(--border);padding:8px 15px}
.tab.active .cnt{background:rgba(255,255,255,.24)}
.tab .fc{color:var(--faint)}

th{background:var(--surface);color:var(--muted);text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:700;border-bottom:1px solid var(--border);padding:13px 14px;white-space:normal}
th.num{white-space:normal}
th.tmain,td.tmain{min-width:180px}
table{table-layout:auto}

thead tr{box-shadow:none}
td{padding:13px 14px}

.badge-status{border-radius:999px;padding:5px 12px;font-weight:700;font-size:11.5px;color:#fff}
.badge-status::before{display:none}
.st-g{background:var(--ok)}.st-r{background:var(--danger)}.st-y{background:var(--warn)}
.st-b{background:var(--primary)}.st-i{background:var(--info)}.st-n{background:var(--faint)}
.pill{border-radius:999px}
.risk{border-radius:999px;padding:4px 11px}
.kind{border-radius:999px;padding:3px 9px}
.progress{border-radius:999px}.progress i{background:linear-gradient(90deg,#1F9D57,#35d3a3)}




/* ===== Panel phải: hộp thư việc / theo dõi hồ sơ ===== */
.pnl{position:fixed;top:78px;right:18px;bottom:18px;width:360px;max-height:calc(100vh - 96px);background:var(--surface-2);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;z-index:30;animation:pslide .18s ease}
@keyframes pslide{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
[data-theme="dark"] .pnl{background:var(--surface)}
.pnlbtn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--primary);display:grid;place-items:center;cursor:pointer;transition:.15s}
.pnlbtn:hover{border-color:var(--primary);background:var(--primary-tint)}
.pnlbtn.on{background:var(--primary);border-color:var(--primary);color:#fff}
.pnlbtn-n{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--warn);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface)}
.pnlh{display:flex;align-items:flex-start;gap:12px;padding:18px 18px 12px}
.pnlt{font-family:'Manrope','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;font-weight:800}
.pnls{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.pnlh .icon-btn{margin-left:auto;width:32px;min-width:32px;height:32px}
.pnlcnt{display:flex;gap:8px;padding:0 18px 12px}
.pnlb{flex:1;overflow-y:auto;padding:0 18px 18px}
.pnlsec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:700;margin:16px 0 8px}
.pnlsec:first-child{margin-top:4px}
.pbadge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.pbadge.y,.pbadge.run{background:var(--warn-tint);color:var(--warn)}
.pbadge.r{background:var(--danger-tint);color:var(--danger)}
.pbadge.g,.pbadge.done{background:var(--ok-tint);color:var(--ok)}
.pbadge.todo{background:var(--surface-2);color:var(--faint)}
[data-theme="dark"] .pbadge.todo{background:var(--surface);color:var(--faint)}

.pitem{display:flex;gap:10px;align-items:flex-start;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.15s}
.pitem:hover{border-color:var(--primary);box-shadow:0 4px 14px rgba(30,111,235,.10);transform:translateY(-1px)}
.pitem:active{transform:none;box-shadow:none}
.pitxt{flex:1;min-width:0;font-size:12.5px;line-height:1.45}
.pitxt b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px}
.pitm{font-size:11px;color:var(--faint);white-space:nowrap}

.ptl{display:flex;flex-direction:column}
.pst{display:flex;gap:10px;align-items:flex-start;padding:9px 0;position:relative}
.pst::after{content:'';position:absolute;left:9px;top:28px;bottom:-2px;width:2px;background:var(--border)}
.pst:last-child::after{display:none}
.pst.done::after{background:var(--ok)}
.pdot{width:20px;height:20px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--surface);border:2px solid var(--border-strong);color:var(--faint);z-index:1}
.pst.done .pdot{background:var(--ok);border-color:var(--ok);color:#fff}
.pst.run .pdot{border-color:var(--warn);background:var(--warn-tint);animation:ppulse 1.4s ease-in-out infinite}
@keyframes ppulse{0%,100%{box-shadow:0 0 0 0 rgba(199,119,0,.35)}50%{box-shadow:0 0 0 6px rgba(199,119,0,0)}}
.pst>div{flex:1;min-width:0}
.pn2{font-size:13px;font-weight:600}
.pw{font-size:11.5px;color:var(--muted);margin-top:2px}

.pcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;transition:.15s}
.pcard:hover{border-color:var(--border-strong);box-shadow:0 4px 14px rgba(16,24,40,.07)}
.pctop{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.pconf{margin-left:auto;font-size:11px;color:var(--muted)}
.pctitle{font-size:13.5px;font-weight:700;line-height:1.4}
.pcline{font-size:11.5px;color:var(--muted);margin-top:4px}
.pcwhy{font-size:12.5px;line-height:1.5;margin-top:8px}
.pcmore{margin-top:10px;background:none;border:0;padding:0;color:var(--primary);font-weight:600;font-size:12px;font-family:inherit;cursor:pointer}
.pcev{margin-top:10px;display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--border);padding-top:10px}
.pev{display:flex;gap:8px;font-size:11.5px;line-height:1.45}
.pev b{font-weight:600}
.pev>div>div{color:var(--muted)}
.pevk{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);height:fit-content;white-space:nowrap}
[data-theme="dark"] .pevk{background:var(--bg)}
.pcact{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.phist{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:8px}
.pempty{font-size:12.5px;color:var(--muted);padding:12px;background:var(--surface);border:1px dashed var(--border-strong);border-radius:12px}

.pask{border-top:1px solid var(--border);padding:12px 18px 14px;background:var(--surface)}
[data-theme="dark"] .pask{background:var(--surface-2)}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.paskrow{display:flex;gap:8px}
.paskrow .input{flex:1}
.pnote{font-size:11px;color:var(--faint);margin-top:8px;line-height:1.4}


.pnl{box-shadow:var(--shadow-lg)}
.app.haspnl .content{padding-right:400px}
.app.haspnl .topbar{padding-right:396px}

/* ===== Trang chi tiết theo mẫu hiện đại ===== */
.rec-head{margin:-24px -28px 0;padding:22px 28px 6px;background:var(--surface-2);border-bottom:1px solid var(--border)}
[data-theme="dark"] .rec-head{background:var(--surface)}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.crumb button{border:0;background:none;color:var(--primary);font-weight:600;font-size:12.5px;font-family:inherit;padding:0}
.rec-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rec-title h2{margin:0;font-family:'Manrope','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:26px;font-weight:800;letter-spacing:-.02em}
.rec-amt{margin-left:auto;text-align:right;line-height:1.2}
.rec-amt b{display:block;font-family:'Manrope','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:22px;font-weight:800}
.rec-sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.kvstrip{display:flex;flex-wrap:wrap;gap:10px 34px;margin:18px 0 4px}
.kvstrip>div{display:flex;flex-direction:column;gap:3px;min-width:0}
.kvstrip span{font-size:11.5px;color:var(--muted)}
.kvstrip b{font-size:13.5px;font-weight:700}
.procline{display:flex;gap:0;margin:22px 0 0;padding-bottom:6px}
.ps{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;position:relative;text-align:center;padding:0 6px}
.ps::after{content:'';position:absolute;top:13px;left:50%;right:-50%;height:2px;background:var(--border-strong)}
.ps:last-child::after{display:none}
.ps.done::after{background:var(--ok)}
.pn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--surface);color:var(--faint);border:2px solid var(--border-strong);position:relative;z-index:1}
.pl{font-size:12.5px;color:var(--muted);max-width:130px;line-height:1.35}
.ps.done .pn{background:var(--ok);border-color:var(--ok);color:#fff}
.ps.done .pl{color:var(--text)}
.ps.cur .pn{background:#0c3036;border-color:#0c3036;color:#fff}
[data-theme="dark"] .ps.cur .pn{background:var(--primary);border-color:var(--primary)}
.ps.cur .pl{color:var(--text);font-weight:700}
/* tab chi tiết: gạch chân như mẫu */
.tabs{gap:0;border-bottom:1px solid var(--border);margin:0 -28px 20px;padding:0 28px}
.tab{border-radius:0;background:none;border:none;border-bottom:2px solid transparent;padding:14px 18px;font-size:13.5px}
.tab.active{background:none;color:var(--text);font-weight:800;border-bottom:2px solid #0c3036}
[data-theme="dark"] .tab.active{border-bottom-color:var(--primary);color:var(--primary)}
.tab:hover{color:var(--text)}

/* ===== Panel: nền teal đậm theo mẫu ===== */
.botmark{width:22px;height:22px;display:block;flex:none}
.pnlbtn{background:linear-gradient(135deg,#12454a,#0c3036);border-color:transparent;box-shadow:0 4px 12px rgba(12,48,54,.35)}
.pnlbtn:hover{background:linear-gradient(135deg,#17565c,#0f3d45)}
.pnlbtn.on{background:linear-gradient(135deg,#17565c,#0f3d45);border-color:#35d3a3}
.pnl,[data-theme="dark"] .pnl{background:radial-gradient(120% 60% at 100% 0%,#12454a 0%,#0c3036 45%,#082227 100%);border-color:rgba(255,255,255,.10);color:#fff;box-shadow:0 18px 48px rgba(8,34,39,.38)}
.pnlt{display:flex;align-items:center;gap:9px;color:#fff}
.pnls{color:rgba(255,255,255,.6)}
.pnl .icon-btn{background:transparent;border-color:rgba(255,255,255,.16);color:rgba(255,255,255,.7)}
.pnl .icon-btn:hover{color:#fff;border-color:rgba(255,255,255,.4)}
.pnlsec{color:rgba(255,255,255,.45)}
.pnl .pbadge.y{background:rgba(224,162,74,.18);color:#e8bd7c}
.pnl .pbadge.r{background:rgba(232,100,100,.18);color:#f0a0a0}
.pnl .pbadge.g,.pnl .pbadge.done{background:rgba(53,211,163,.18);color:#6fe0be}
.pnl .pbadge.todo{background:rgba(255,255,255,.09);color:rgba(255,255,255,.55)}
.pitem,.pcard,.phist{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.10);color:#fff}
.pitem:hover{border-color:#35d3a3;box-shadow:0 4px 14px rgba(53,211,163,.14)}
.pcard:hover{border-color:rgba(255,255,255,.24);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.pitxt b,.pw,.pcline,.pconf,.pitm,.phist,.pev>div>div{color:rgba(255,255,255,.6)}
.pempty{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.16);color:rgba(255,255,255,.6)}
.pcmore{color:#6fe0be}
.pcev{border-top-color:rgba(255,255,255,.14)}
.pevk,[data-theme="dark"] .pevk{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);color:rgba(255,255,255,.65)}
.pdot{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.22);color:rgba(255,255,255,.5)}
.pst::after{background:rgba(255,255,255,.14)}
.pst.done .pdot{background:#35d3a3;border-color:#35d3a3;color:#082227}
.pst.done::after{background:rgba(53,211,163,.5)}
.pst.run .pdot{border-color:#e8bd7c;background:rgba(224,162,74,.2);color:#e8bd7c}
.pnl .btn-ok{background:#35d3a3;color:#082227;border-color:transparent}
.pnl .btn-ghost{background:transparent;border-color:rgba(255,255,255,.22);color:#fff}
.pnl .btn-ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.4)}
.pask,[data-theme="dark"] .pask{background:rgba(0,0,0,.22);border-top-color:rgba(255,255,255,.10)}
.pask .chip{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:rgba(255,255,255,.85)}
.pask .chip:hover{border-color:#35d3a3;color:#fff}
.paskrow{position:relative;align-items:center}
.pask .input{border:0;border-radius:999px;padding:12px 46px 12px 18px;background:linear-gradient(100deg,#93a7e8,#a7d9e6);color:#0c3036;font-weight:600}
.pask .input::placeholder{color:rgba(12,48,54,.6);font-weight:500}
.pask .paskrow .btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;padding:0;border-radius:50%;background:rgba(255,255,255,.35);border-color:transparent;color:#0c3036}
.pask .paskrow .btn:hover{background:rgba(255,255,255,.6)}
.pnote{color:rgba(255,255,255,.45)}







/* ===== Bảng: chọn dòng, sắp xếp, phân trang ===== */
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
.sortic{font-size:9.5px;margin-left:6px;opacity:.55;font-style:normal}
th.asc .sortic,th.desc .sortic{opacity:1;color:var(--primary)}
tbody tr:hover{background:var(--surface-2)}
.tfoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--border)}
.tcount{font-size:12.5px;color:var(--muted)}
.tpage{margin-left:auto;display:flex;align-items:center;gap:6px}
.pgb{min-width:32px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.pgb:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.pgb.on{background:#0c3036;border-color:#0c3036;color:#fff}
[data-theme="dark"] .pgb.on{background:var(--primary);border-color:var(--primary)}
.pgb:disabled{opacity:.45;cursor:not-allowed}
.pgsel{height:32px;padding:0 8px;font-size:12.5px;margin-left:4px}

.userbox .logout{margin-left:auto;width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:9px;border:1px solid rgba(255,255,255,.16);background:transparent;color:rgba(255,255,255,.7);cursor:pointer}
.userbox .logout:hover{background:rgba(232,100,100,.16);border-color:rgba(232,100,100,.5);color:#f0a0a0}
.app.mini .userbox .logout{display:none}
.app.mini .sidebar-foot .mlogout{display:grid}
.mlogout{display:none;width:40px;height:36px;margin:8px auto 0;place-items:center;border-radius:9px;border:1px solid rgba(255,255,255,.16);background:transparent;color:rgba(255,255,255,.7);cursor:pointer}
.mlogout:hover{background:rgba(232,100,100,.16);border-color:rgba(232,100,100,.5);color:#f0a0a0}

/* ===== Màn đăng nhập: hai cột ===== */
.lg{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
@media(max-width:900px){.lg{grid-template-columns:1fr}.lg-r{display:none}}
.lg-l{position:relative;overflow:hidden;background:radial-gradient(120% 80% at 20% 0%,#0f4048 0%,#083039 45%,#04222a 100%);display:grid;place-items:center;padding:40px}
.lg-wave{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:rgba(53,211,163,.16);stroke-width:1}
.lg-form{position:relative;width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:14px}
.lg-mark{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#9fe9d2;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
.lg-name{text-align:center;color:rgba(255,255,255,.62);font-size:13px;line-height:1.5;margin-bottom:10px}
.lg-name b{display:block;font-family:'Manrope','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:20px;font-weight:800;color:#fff}
.lg-in{width:100%;border:0;border-radius:8px;background:#eef1f8;color:#0c3036;padding:14px 16px;font:inherit;font-size:14px;outline:none}
.lg-in:focus{box-shadow:0 0 0 2px rgba(53,211,163,.55)}
.lg-pw{position:relative;width:100%}
.lg-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:none;color:#6b7a86;cursor:pointer;padding:4px;display:grid;place-items:center}
.lg-eye:hover{color:#0c3036}
.lg-btn{width:100%;border:0;border-radius:8px;background:#fff;color:#0c3036;padding:14px;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:6px;transition:.15s}
.lg-btn:hover{background:#dff6ee}
.lg-alt{display:flex;flex-direction:column;gap:8px;margin-top:14px;width:100%}
.lg-alt button{border:0;background:none;color:rgba(255,255,255,.72);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:6px}
.lg-alt button:hover{color:#fff}
.lg-alt button.on{color:#6fe0be}
.lg-r{position:relative;background:linear-gradient(180deg,#fbfcfe,#f2f5f9);display:grid;place-items:center;padding:60px}
.lg-art{position:relative;width:min(440px,74%);aspect-ratio:1/.85}
.lg-svg{width:100%;height:100%;display:block;filter:drop-shadow(0 22px 40px rgba(16,42,54,.16))}

.lg-cap{position:absolute;bottom:26px;font-size:11.5px;color:#9aa5b4;letter-spacing:.08em}


/* ===== Ứng dụng điện thoại cho khách hàng ===== */
.mob-stage{min-height:100vh;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:40px;padding:40px;background:radial-gradient(90% 60% at 20% 0%,#0f4048,#04222a)}
.mob-side{justify-self:end;max-width:300px;color:rgba(255,255,255,.75);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.mob-side-t{font-family:'Manrope','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:22px;font-weight:800;color:#fff}
.mob-side p{margin:0;font-size:13px;line-height:1.6}
.mob-side .btn-ghost{border-color:rgba(255,255,255,.24);color:#fff;background:transparent}
.mob-side .btn-ghost:hover{background:rgba(255,255,255,.1)}
.phone{position:relative;width:390px;height:800px;max-height:calc(100vh - 80px);background:var(--bg);border:11px solid #0b171c;border-radius:44px;box-shadow:0 40px 80px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden}
.ph-status{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:12px 22px 6px;font-size:12px;font-weight:700;color:var(--text);background:var(--surface)}
.ph-stat-r{font-weight:600;color:var(--muted)}
.ph-top{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:6px 16px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.ph-title{flex:1;min-width:0;font-family:'Manrope','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:17px;font-weight:800}
.ph-av{width:34px;height:34px;border-radius:50%;background:var(--teal-tint);color:var(--teal);display:grid;place-items:center;font-size:12.5px;font-weight:800}
.ph-back,.ph-ic{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:700;cursor:pointer}
.ph-back{transform:scaleX(-1)}
.ph-back:hover,.ph-ic:hover{color:var(--primary);border-color:var(--primary)}
.ph-body{flex:1;overflow-y:auto;padding:16px 14px 172px}
.mobsc .grid2,.mobsc .grid,.mobsc .kpis,.mobsc .kpis3,.mobsc .grid3{grid-template-columns:1fr!important}
.mobsc .card{margin-bottom:12px}
/* bảng chuyển thành thẻ một cột trong khung điện thoại */
.mobsc .table-wrap{overflow-x:visible}
.mobsc table,.mobsc tbody,.mobsc tr,.mobsc td{display:block;width:auto}
.mobsc thead,.mobsc .tfoot .tpage{display:none}
.mobsc tr{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin:0 0 10px}
.mobsc tr:hover{background:var(--surface)}
.mobsc td{border:0;padding:3px 0;font-size:13px}
.mobsc td.num{text-align:left;font-weight:700}
.mobsc td.req-id{font-size:11.5px;color:var(--muted)}
.mobsc .tfoot{padding:6px 2px;border:0}
.mobsc .btn{min-height:44px}
.ph-tabs{position:absolute;z-index:3;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--border);padding:8px 6px 18px}
.ph-tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--faint);font:inherit;font-size:10.5px;font-weight:600;cursor:pointer;min-height:44px}
.ph-tabs button.on{color:var(--primary)}
.ph-fab{position:absolute;z-index:3;right:18px;bottom:96px;width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,#17565c,#0c3036);color:#fff;display:grid;place-items:center;box-shadow:0 12px 26px rgba(12,48,54,.45);cursor:pointer}
.ph-fab:hover{transform:translateY(-2px)}
.ph-home{position:absolute;z-index:4;left:50%;transform:translateX(-50%);bottom:7px;width:120px;height:4px;border-radius:99px;background:var(--border-strong)}
@media(max-width:1000px){
  .mob-stage{grid-template-columns:1fr;justify-items:center;gap:18px;padding:18px}
  .mob-stage .mob-side{justify-self:center;max-width:390px;align-items:center;text-align:center;order:2}
  .mob-stage .mob-side p{display:none}
  .mob-stage .phone{max-height:calc(100vh - 140px)}
}



/* ===== Ứng dụng điện thoại: màn thiết kế riêng ===== */
.mobsc{display:block;font-size:14px}
.m-sec{display:flex;align-items:center;font-family:'Manrope','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:13px;font-weight:800;margin:20px 0 10px}
.m-more{margin-left:auto;min-height:44px;padding:0 4px 0 12px;border:0;background:none;color:var(--primary);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.m-sec{min-height:44px}
.m-pill{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.m-pill.g{background:var(--ok-tint);color:var(--ok)}.m-pill.y{background:var(--warn-tint);color:var(--warn)}
.m-pill.r{background:var(--danger-tint);color:var(--danger)}.m-pill.n{background:var(--surface-2);color:var(--muted)}
.m-card-hero{border-radius:18px;padding:18px;color:#fff;background:radial-gradient(120% 90% at 100% 0%,#17565c,#0c3036);box-shadow:0 14px 30px rgba(12,48,54,.32)}
.m-hero-top{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:rgba(255,255,255,.65)}
.m-hero-top b{color:#6fe0be;font-size:11.5px;letter-spacing:.06em}
.m-hero-name{font-family:'Manrope','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:20px;font-weight:800;margin-top:14px}
.m-hero-no{font-family:var(--mono);font-size:13.5px;color:rgba(255,255,255,.72);letter-spacing:.12em;margin-top:4px}
.m-hero-foot{display:flex;gap:20px;margin-top:16px}
.m-hero-foot span{display:block;font-size:10.5px;color:rgba(255,255,255,.55)}
.m-hero-foot b{font-size:13.5px}
.m-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.m-acts button{min-height:74px;border:1px solid var(--border);background:var(--surface);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font:inherit;font-size:10.5px;font-weight:600;color:var(--text);cursor:pointer;padding:8px 4px;line-height:1.25;text-align:center}
.m-acts button span{color:var(--primary);display:grid;place-items:center}
.m-acts button:active{background:var(--surface-2)}
.m-track{display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:16px;padding:14px;font:inherit;cursor:pointer;color:var(--text)}
.m-track-h{display:flex;align-items:center;gap:10px}
.m-track-h b{font-size:14.5px;flex:1;min-width:0}
.m-track-s{font-size:12px;color:var(--muted);margin-top:3px}
.m-dots{display:flex;gap:6px;margin:12px 0}
.m-dots i{height:5px;flex:1;border-radius:999px;background:var(--border-strong)}
.m-dots i.done{background:var(--ok)}.m-dots i.cur{background:var(--warn)}
.m-track-f{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;color:var(--muted)}
.m-track-f b{font-family:'Manrope','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:17px;font-weight:800;color:var(--text)}
.m-ben{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.m-ben-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px}
.m-ben-h span{font-size:12px;color:var(--muted)}
.m-bar{height:7px;border-radius:999px;background:var(--surface-2);margin-top:9px;overflow:hidden}
.m-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#1F9D57,#35d3a3)}
.m-ben.big .m-ben-n{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.45}
.m-sum{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.m-sum span{font-size:12px;color:var(--muted)}
.m-sum b{display:block;font-family:'Manrope','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:24px;font-weight:800;margin-top:4px}
.m-sum i{font-style:normal;font-size:12px;color:var(--muted)}
.m-seg{display:flex;gap:6px;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:14px}
.m-seg button{flex:1;min-height:44px;border:0;background:none;border-radius:9px;font:inherit;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.m-seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.m-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px;margin-bottom:9px;font:inherit;color:var(--text);cursor:pointer;min-height:64px}
.m-row-i{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center}
.m-row-i.g{background:var(--ok-tint);color:var(--ok)}.m-row-i.y{background:var(--warn-tint);color:var(--warn)}
.m-row-i.r{background:var(--danger-tint);color:var(--danger)}.m-row-i.n{background:var(--surface-2);color:var(--muted)}
.m-row-t{flex:1;min-width:0}
.m-row-t b{display:block;font-size:13.5px}
.m-row-t span{font-size:11.5px;color:var(--muted)}
.m-row-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.m-row-r b{font-size:13.5px}
.m-empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 0}
.m-cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:14px;background:linear-gradient(135deg,#17565c,#0c3036);color:#fff;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:16px}
.m-cta:active{transform:translateY(1px)}
.m-ghost{display:block;width:100%;min-height:48px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;margin-top:10px}
.m-amt{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;text-align:center}
.m-amt span{font-size:12px;color:var(--muted)}
.m-amt b{display:block;font-family:'Manrope','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:30px;font-weight:800;margin:6px 0 10px;color:var(--ok)}
.m-amt.bad b{color:var(--danger);font-size:22px}
.m-steps{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px}
.m-step{display:flex;gap:12px;align-items:flex-start;padding-bottom:16px;position:relative}
.m-step:last-child{padding-bottom:0}
.m-step::after{content:'';position:absolute;left:6px;top:16px;bottom:0;width:2px;background:var(--border)}
.m-step:last-child::after{display:none}

function enPass(el){
  if(S.lang!=="en"||!el) return;
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT), out=[];
  while(w.nextNode()) out.push(w.currentNode);
  out.forEach(n=>{
    const raw=n.nodeValue, k=raw.trim();
    if(!k||k.length>320) return;
    let v=EN_MAP[k];
    if(v===undefined){ for(const [rx,f] of EN_RX){ const m=k.match(rx); if(m){ v=f(m); break; } } }
    if(v!==undefined&&v!==k) n.nodeValue=raw.replace(k,v);
  });
}

/* Dải tiến trình xử lý hồ sơ — 5 chặng nghiệp vụ */
function procline(c){
  const st=claimState(c);
  const idx = st==="UNDER_ASSESSMENT" ? 3 : st==="PENDING_APPROVAL" ? 4 : st==="APPROVED" ? 5 : (st==="PAID"||st==="DECLINED"||st==="CLOSED") ? 6 : 3;
  const names=[t("Khách gửi hồ sơ","Claim submitted"),t("Đọc & đối chiếu chứng từ","Documents read"),t("Thẩm định","Assessment"),t("Phê duyệt","Approval"),t("Chi trả & thông báo","Payment & notice")];
  return `<div class="procline">${names.map((n,i)=>{
    const k = i+1<idx ? "done" : i+1===idx ? "cur" : "todo";
    return `<div class="ps ${k}"><span class="pn">${k==="done"?"✓":i+1}</span><span class="pl">${n}</span></div>`;
  }).join("")}</div>`;
}

/* Việc cần làm — người dùng là trung tâm; AI chỉ là một trong các nguồn việc */
function todos(c){
  const st=claimState(c); const L=[];
  if(c.id==="B") return L;
  if(c.id==="A"&&c.st.decision===null) L.push({k:"do",t:t("Quyết định đề xuất ở dòng 4 (Atorvastatin) — kiểm tra y khoa cho rằng không thuộc phạm vi","Decide the proposal on line 4 (Atorvastatin) — the clinical check says out of cover"),go:"costs"});
  if(c.id==="C"&&!c.st.ack) L.push({k:"do",t:t("Kiểm 3 dòng thuốc độ tin cậy thấp (viết tay) trên ảnh gốc","Check 3 low-confidence drug lines (handwriting) against the original"),go:"costs"});
  if(c.id==="D"&&st==="UNDER_ASSESSMENT") L.push({k:"do",t:t("Xác nhận từ chối theo Điều 5.2 (thời gian chờ nha khoa) và trình người duyệt","Confirm the decline under Clause 5.2 (dental waiting period) and submit"),go:"events"});
  if(c.id==="A"&&c.st.decision!==null&&!c.st.submitted) L.push({k:"do",t:t("Gửi phê duyệt — phương án đã đủ điều kiện","Submit for approval — the plan is ready"),go:"settle"});
  if(c.id==="C"&&c.st.ack&&!c.st.submitted) L.push({k:"do",t:t("Gửi phê duyệt","Submit for approval"),go:"settle"});
  if(st==="PENDING_APPROVAL") L.push({k:"wait",t:t("Chờ người duyệt (Phạm Quốc Anh)","Awaiting approver (Phạm Quốc Anh)"),go:"approval"});
  if(st==="APPROVED") L.push({k:"do",t:t("Phát hành lệnh chi trả","Issue payment instruction"),go:"approval"});
  if(st==="DECLINED") L.push({k:"do",t:t("Gửi thư từ chối và đóng hồ sơ","Send decline letter and close"),go:"approval"});
  return L;
}

    ${note(t("Tên chủ tài khoản sẽ được đối chiếu <b>trước khi chi tiền</b>. Bạn vẫn gửi hồ sơ được ngay bây giờ.","The account name is verified <b>before payment</b>. You can still submit now."),"i")}

  if(w===2){ const st=[[t("Bảng kê chi phí","Cost statement"),t("Bắt buộc","Mandatory"),"2 "+t("ảnh","photos"),"g"],[t("Phiếu khám bệnh","Examination record"),t("Bắt buộc","Mandatory"),"1 "+t("ảnh","photo"),"g"],[t("Hoá đơn VAT (XML)","VAT invoice (XML)"),t("Bắt buộc","Mandatory"),t("đã tải tệp","file uploaded"),"g"],[t("Giấy tờ tùy thân","Identity document"),t("Bắt buộc","Mandatory"),"1 "+t("ảnh","photo"),"g"],[t("Đơn thuốc","Prescription"),t("Dự kiến","Expected"),"1 "+t("ảnh","photo"),"g"],[t("Kết quả xét nghiệm","Lab result"),t("Tuỳ chọn","Optional"),t("chưa có","none"),"n"]];

    ${st.map(d=>`<div class="doc-row"><div class="doc-ic" style="${d[3]==="n"?"background:var(--surface-2);color:var(--faint)":""}">${ic(d[3]==="n"?"camera":"check")}</div><div style="flex:1"><b>${d[0]}</b><div class="sub">${tag(d[1],d[1]===t("Bắt buộc","Mandatory")?"r":d[1]===t("Dự kiến","Expected")?"y":"n")} · ${d[2]}${d[3]==="g"?` · ${dec(t("rõ nét","sharp"),"ok")}`:""}</div></div><button class="btn btn-ghost btn-sm">${d[3]==="n"?t("Chụp","Capture"):t("Chụp lại","Retake")}</button></div>`).join("")}
    <div class="upload" style="margin-top:12px">${ic("camera",26)}<div style="margin-top:6px"><b>${t("Chụp thêm chứng từ khác","Add another document")}</b></div><div class="sub">JPG · PNG · PDF · ${t("tối đa 20 tệp / 50 trang","up to 20 files / 50 pages")}</div></div>

  if(w===3){ const steps=[[t("Nhận chứng từ","Documents received"),"5 "+t("tệp · 6 trang","files · 6 pages")],[t("Đọc và kiểm tra chứng từ","Reading & checking documents"),t("số tiền, ngày, chẩn đoán lấy từ giấy tờ","amounts, dates, diagnosis from your documents")],[t("Kiểm tra đủ hồ sơ","Completeness check"),t("theo danh mục loại điều trị","against the checklist")],[t("Đối chiếu với hợp đồng","Checking against your policy"),t("thời gian chờ, hạn mức, đồng chi trả","waiting period, limits, co-pay")],[t("Chuyển thẩm định","Handed to assessment"),t("tự động nếu đủ điều kiện, nếu không cán bộ xem","automatic if eligible, else an assessor looks")]];

  const c=CLAIMS.A; const cs=custState(c);
  return wiz+`<div class="card card-pad" style="max-width:860px"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h3 class="h" style="margin:0">${t("Hồ sơ đã được tiếp nhận","Your claim has been received")}</h3>${tag(cs[0],cs[1])}<span class="pill">${c.no}</span></div>

    ${note(t("<b>Điều gì xảy ra tiếp:</b> cán bộ thẩm định đang xem hồ sơ. Bạn sẽ nhận thông báo trong ngày làm việc, kèm kết quả theo từng khoản. Nếu thiếu chứng từ, chúng tôi sẽ nói rõ cần bổ sung gì.","<b>What happens next:</b> an assessor is reviewing. You will be notified within the working day with an item-by-item result. If a document is missing we will say exactly which."),"i")}

};
function runPipe(){ if(S.view!=="newclaim"||S.wiz!==3) return; if(S.pipe<5){ S.pipe++; render(); setTimeout(runPipe, S.pipe===2?1600:900); } }

function askChat(i){ CHAT.push(["user",CHAT_Q[i][0]],["ai",CHAT_Q[i][1]]); render(); }
function askFree(v){ if(!v.trim()) return; CHAT.push(["user",esc(v)],["ai",t("Tôi chỉ trả lời về hồ sơ và quyền lợi của bạn. Câu hỏi này đã được ghi vào hồ sơ CLM-26-000417 — cán bộ sẽ liên hệ trong ngày làm việc.","I only answer about your claims and cover. This question has been logged on claim CLM-26-000417 — an assessor will get back to you within the working day.")]); render(); }

render();
</script>
</body>
</html>
