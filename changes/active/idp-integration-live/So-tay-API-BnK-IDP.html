<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="So tay API BnK IDP cho hackathon Agentic Health Claim.">
<style>:root{color-scheme:light dark}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sổ tay API BnK IDP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#ECEDE7; --surface:#FAFAF8; --surface-2:#F2F3EE;
  --ink:#181B19; --ink-2:#3C413D; --muted:#5D625E; --faint:#878C86;
  --line:#D3D5CC; --line-2:#E2E4DC;
  --accent:#2B4D6F; --accent-soft:#DCE5EE;
  --ok:#2D6A4E; --ok-soft:#DDEBE2;
  --warn:#8A6410; --warn-soft:#F3E9D2;
  --bad:#9C2B2B; --bad-soft:#F1DEDC;
  --shadow:0 1px 2px rgba(24,27,25,.06), 0 8px 24px -16px rgba(24,27,25,.28);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14171A; --surface:#1C2023; --surface-2:#22272A;
    --ink:#E4E7E2; --ink-2:#C6CBC5; --muted:#9BA29C; --faint:#767D77;
    --line:#333A3D; --line-2:#2A3033;
    --accent:#8FB4D9; --accent-soft:#1E2A36;
    --ok:#77BF9B; --ok-soft:#18271F;
    --warn:#D5AC5E; --warn-soft:#2A2315;
    --bad:#E08480; --bad-soft:#2C1B1A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#14171A; --surface:#1C2023; --surface-2:#22272A;
  --ink:#E4E7E2; --ink-2:#C6CBC5; --muted:#9BA29C; --faint:#767D77;
  --line:#333A3D; --line-2:#2A3033;
  --accent:#8FB4D9; --accent-soft:#1E2A36;
  --ok:#77BF9B; --ok-soft:#18271F;
  --warn:#D5AC5E; --warn-soft:#2A2315;
  --bad:#E08480; --bad-soft:#2C1B1A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.011em}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.92em}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
@media(max-width:600px){.wrap{padding-inline:16px}}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;padding-block:14px 10px}
.brand h1{font-size:19px;letter-spacing:-.02em}
.brand .base{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line-2);padding:3px 8px;border-radius:4px}
.brand .stamp{margin-left:auto;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);padding:4px 10px;border-radius:3px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:5px}

main{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:26px 72px}
@media(max-width:600px){main{padding-inline:16px}}

/* ---------- stat strip ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:8px;overflow:hidden;margin-bottom:22px}
.stat{background:var(--surface);padding:13px 15px}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.stats.five .stat:last-child{grid-column:1/-1}}
@media(max-width:400px){.stats{grid-template-columns:1fr}.stats.five .stat:last-child{grid-column:auto}}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.search{flex:1 1 200px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 11px;font:inherit;font-size:13.5px;color:var(--ink)}
.search::placeholder{color:var(--faint)}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.chipgroup{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- api register ---------- */
.grouphead{display:flex;align-items:baseline;gap:10px;margin:26px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grouphead h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2)}
.grouphead .cnt{font-family:var(--mono);font-size:11px;color:var(--faint)}
.grouphead .gstep{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.row{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px 12px;align-items:center;background:var(--surface);border:0;width:100%;text-align:left;padding:11px 14px;cursor:pointer}
.row:hover{background:var(--surface-2)}
.row .m{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;text-align:center;padding:3px 0;border-radius:3px;border:1px solid var(--line)}
.m.GET{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 34%,transparent)}
.m.POST{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.m.PUT{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.m.PATCH{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.row .txt{min-width:0}
.row .p{display:block;font-family:var(--mono);font-size:12.5px;color:var(--ink);word-break:break-word}
.row .nm{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.row .rt{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.THẬT{background:var(--ok-soft);color:var(--ok)}
.pill.BẪY{background:var(--warn-soft);color:var(--warn)}
.pill.LỖI-ĐÚNG{background:var(--warn-soft);color:var(--warn)}
.pill.HỎNG{background:var(--bad-soft);color:var(--bad)}
.pill.CẤM{background:var(--bad-soft);color:var(--bad)}
.pill.CHƯA{background:var(--surface-2);color:var(--faint);border:1px solid var(--line)}
.pri{font-family:var(--mono);font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:2px 5px}
.ms{font-family:var(--mono);font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.pri.P0{color:var(--ink-2);border-color:var(--ink-2)}
.arrow{color:var(--faint);font-size:15px;line-height:1}
@media(max-width:620px){
  .row{grid-template-columns:50px minmax(0,1fr);}
  .row .rt{grid-column:1/-1;justify-content:flex-start}
  .arrow{display:none}
}

/* ---------- detail ---------- */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 0;font-size:13px;color:var(--accent);cursor:pointer;margin-bottom:6px}
.dhead{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}
.dhead .line1{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:9px}
.dhead .m{font-family:var(--mono);font-size:11px;font-weight:600;padding:4px 9px;border-radius:4px;border:1px solid var(--line)}
.dhead .path{font-family:var(--mono);font-size:16px;font-weight:500;word-break:break-word}
.dhead h2{font-size:24px;letter-spacing:-.02em;margin-bottom:8px}
.dhead .purpose{color:var(--ink-2);max-width:68ch;font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.meta b{color:var(--ink-2);font-weight:500}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:26px}
@media(min-width:960px){.cols{grid-template-columns:minmax(0,1fr) 300px;gap:34px;align-items:start}}
.sec{margin-bottom:26px}
.sec>h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--line-2)}
table{width:100%;border-collapse:collapse;font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--line-2);border-radius:7px;background:var(--surface)}
th{text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:top;color:var(--ink-2)}
tr:last-child td{border-bottom:0}
td:first-child{color:var(--ink)}
td.k{font-family:var(--mono);font-size:12px;white-space:nowrap}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.req td:nth-child(3){white-space:nowrap;font-size:12px}
pre{margin:0;background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:13px 15px;overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--ink-2)}
pre.res{border-left:3px solid var(--ok)}
pre.res.bad{border-left-color:var(--bad)}
pre.res.warn{border-left-color:var(--warn)}
.note{font-size:12.5px;color:var(--muted);margin-top:8px;font-style:italic}
ul.rules{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
ul.rules li{position:relative;padding-left:20px;font-size:13.5px;color:var(--ink-2)}
ul.rules li::before{content:"";position:absolute;left:4px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.rail{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:14px 15px}
.card h4{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:8px}
.card p,.card div{font-size:13px;color:var(--ink-2)}
.card.warnbox{border-left:3px solid var(--warn);background:var(--warn-soft)}
.card.badbox{border-left:3px solid var(--bad);background:var(--bad-soft)}
.errlist{display:flex;flex-direction:column;gap:7px}
.errlist .e{font-size:12.5px;line-height:1.5}
.errlist .c{display:block;font-family:var(--mono);font-weight:600;color:var(--bad);word-break:break-word}

/* ---------- image block ---------- */
.io{display:grid;gap:16px}
@media(min-width:800px){.io{grid-template-columns:minmax(0,300px) minmax(0,1fr);align-items:start}}
.shot{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:9px;box-shadow:var(--shadow)}
.shot img{display:block;width:100%;max-width:100%;border-radius:3px}
.shot figcaption{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.45}
figure{margin:0}

/* ---------- chain ---------- */
.chain{display:flex;flex-direction:column;gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.step{display:grid;grid-template-columns:30px 54px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);padding:11px 14px;border:0;width:100%;text-align:left;cursor:pointer}
.step:hover{background:var(--surface-2)}
.step .no{font-family:var(--mono);font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.step .p{display:block;font-family:var(--mono);font-size:12.5px;word-break:break-word}
.step .d{font-size:12.5px;color:var(--muted)}
.step .t{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:620px){.step{grid-template-columns:26px 48px minmax(0,1fr)}.step .t{grid-column:2/-1}}

/* ---------- traps ---------- */
.traps{display:flex;flex-direction:column;gap:14px}
.trap{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:16px 17px;border-left:3px solid var(--warn)}
.trap.nang{border-left-color:var(--bad)}
.trap.nhe{border-left-color:var(--line)}
.trap .th{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;margin-bottom:8px}
.trap h3{font-size:15px}
.sev{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.sev.nang{background:var(--bad-soft);color:var(--bad)}
.sev.nhe{background:var(--surface-2);color:var(--muted)}
.trap .d{font-size:13.5px;color:var(--ink-2);margin-bottom:9px}
.fix{display:flex;gap:9px;font-size:13.5px;background:var(--surface-2);border-radius:6px;padding:10px 12px;color:var(--ink-2)}
.fix .lab{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ok);white-space:nowrap;padding-top:2px}
.trap .go{background:none;border:0;padding:8px 0 0;font-size:12.5px;color:var(--accent);cursor:pointer}

/* ---------- full flow ---------- */
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.vcard{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:15px 16px;border-left:3px solid var(--ok)}
.vcard.warn{border-left-color:var(--warn)} .vcard.bad{border-left-color:var(--bad)}
.vcard h4{font-size:14.5px;margin-bottom:7px}
.vcard p{font-size:13.5px;color:var(--ink-2)}
.tag{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;white-space:nowrap}
.tag.ok,.tag.ĐÚNG,.tag.TỐT{background:var(--ok-soft);color:var(--ok)}
.tag.BẮT-ĐÚNG{background:var(--ok-soft);color:var(--ok)}
.tag.ỒN{background:var(--warn-soft);color:var(--warn)}
.tag.SAI{background:var(--bad-soft);color:var(--bad)}
.ask{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:15px 17px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px}
.ask .no{font-family:var(--mono);font-size:19px;color:var(--faint);font-variant-numeric:tabular-nums;line-height:1.2}
.ask h4{font-size:15px;margin-bottom:6px}
.ask .why{font-size:13.5px;color:var(--ink-2);margin-bottom:10px}
.ask .want{font-size:13.5px;background:var(--accent-soft);border-radius:6px;padding:9px 12px;display:flex;gap:9px}
.ask .want .lab{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);white-space:nowrap;padding-top:2px}
.pri.CHẶN{color:var(--bad);border-color:var(--bad)}
.pri.CAO{color:var(--warn);border-color:var(--warn)}
.asks{display:flex;flex-direction:column;gap:12px}
/* ---------- việc cần đội IDP ---------- */
.deadline{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:baseline;background:var(--bad-soft);
 border:1px solid var(--bad);border-left-width:3px;border-radius:8px;padding:13px 16px;margin-bottom:22px}
.deadline b{color:var(--bad);font-size:16px}
.deadline span{font-size:13.5px;color:var(--ink-2)}
.ctx{background:var(--surface);border:1px solid var(--line-2);border-left:3px solid var(--accent);
 border-radius:9px;padding:16px 18px;margin-bottom:22px;max-width:96ch}
.ctx h3{font-size:14px;color:var(--accent);margin-bottom:8px}
.ctx p{font-size:13.5px;color:var(--ink-2);margin-bottom:7px}
.ctx p:last-child{margin-bottom:0}
.todo{display:flex;flex-direction:column;gap:13px}
.item{background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:0;overflow:hidden;
 display:grid;grid-template-columns:44px minmax(0,1fr);border-left:3px solid var(--line)}
.item.CHẶN{border-left-color:var(--bad)} .item.CAO{border-left-color:var(--warn)}
.item .no{display:flex;align-items:flex-start;justify-content:center;padding-top:16px;
 font-family:var(--mono);font-size:15px;color:var(--faint);font-variant-numeric:tabular-nums;background:var(--surface-2)}
.item .body{padding:14px 17px 15px}
.item .hd{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:baseline;margin-bottom:7px}
.item h3{font-size:15.5px}
.item .why{font-size:13.5px;color:var(--ink-2);margin-bottom:11px;max-width:92ch}
.do{background:var(--surface-2);border-radius:7px;padding:11px 13px;margin-bottom:9px}
.do h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ok);margin-bottom:6px}
.do ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.do li{position:relative;padding-left:20px;font-size:13.5px;color:var(--ink-2)}
.do li::before{content:"☐";position:absolute;left:2px;color:var(--faint)}
.risk{font-size:12.5px;color:var(--muted);display:flex;gap:8px}
.risk .lab{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
 white-space:nowrap;padding-top:2px}
.han{font-family:var(--mono);font-size:11px;color:var(--ink-2);border:1px solid var(--line);border-radius:3px;padding:2px 7px}
.tl{display:flex;flex-wrap:wrap;gap:1px;background:var(--line-2);border:1px solid var(--line-2);
 border-radius:8px;overflow:hidden;margin-bottom:24px}
.tl .st{flex:1 1 150px;background:var(--surface);padding:12px 14px}
.tl .st b{display:block;font-family:var(--mono);font-size:14px;margin-bottom:3px}
.tl .st span{font-size:12px;color:var(--muted)}
.tl .st.chan b{color:var(--bad)} .tl .st.cao b{color:var(--warn)}
.tl .st.pitch{background:var(--ok-soft)} .tl .st.pitch b{color:var(--ok)}
.tl .st.xong b{color:var(--ok)}
.lead{max-width:70ch;color:var(--ink-2);margin-bottom:20px;font-size:15px}
.hint{font-size:12.5px;color:var(--faint);margin-top:10px}
.empty{padding:40px 0;text-align:center;color:var(--faint);font-size:14px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Sổ tay API BnK IDP</h1>
      <span class="base">idp-api.idpstg.bnksolution.com</span>
      <span class="stamp">Tenant 177 · 17/09/2026</span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="catalog" aria-selected="true">Tổng hợp API<span class="n" id="n-catalog"></span></button>

n bản tiếng Việt cho cả hồ sơ, không gắn với dòng chi phí nào. AG-3 phải tự lấp, và Track 2 phải trình bày là chế độ tư vấn chứ không phải chốt kiểm soát."}, {"k": "bad", "t": "Master data là mắt xích yếu", "d": "HospitalCode, PlaceOfTreatment, SurgeryCodes đều trả giá trị giữ chỗ vì bệnh viện giả lập không có trong bảng 322. Với chứng từ thật thì sẽ tra được, nhưng hành vi khi KHÔNG tra được lại không nhất quán: lúc trả \u003ccode\u003e00000\u003c/code\u003e, lúc \u003cb\u003ebịa\u003c/b\u003e ra \u003ccode\u003e01001\u003c/code\u003e. Không dùng được ba trường này từ flow."}, {"k": "warn", "t": "Thời gian: 2 phút cho một hồ sơ 9 chứng từ", "d": "Trích xuất 9 trang chạy song song xong trong ~65 giây. Đánh giá lâm sàng mất \u003cb\u003e118 giây\u003c/b\u003e (1 chứng từ mất 72 giây, nên nó không tăng tuyến tính). Cộng cả chuỗi khoảng \u003cb\u003e3 phút\u003c/b\u003e cho một hồ sơ. Demo phải có màn hình chờ, không đứng im."}], "chua": [["PDF nhiều trang", "Mọi thứ đã test đều là PNG một trang. Chưa biết thời gian xử lý PDF 5–10 trang, chưa thử \u003ccode\u003eseparatorType\u003c/code\u003e/\u003ccode\u003eseparatorValue\u003c/code\u003e để cắt nhiều chứng từ trong một file, và box của PDF tính bằng inch chứ không phải pixel."], ["extraInputData", "Chưa bơm dữ liệu khai báo vào flow lần nào. Chưa biết flow có đọc template ảo \"Dữ liệu từ DP\" không, và có đối chiếu với chứng từ không. Đây là câu hỏi D3 H2–H3."], ["Độ chính xác", "Chưa chạy \u003ccode\u003e/request/compare\u003c/code\u003e. Chưa có con số accuracy nào để đưa lên slide."], ["Trần quota", "Đã dùng 14 trang. Vẫn không ai biết một block bằng bao nhiêu trang — đây là rủi ro duy nhất có thể làm demo đứng giữa chừng."], ["TTL token, rate limit", "Chưa đo. Đang giả định 30 phút và 100 request/60 giây."], ["subDocumentType", "Vẫn null cho 9 template mới vì \u003ccode\u003embal/template-map\u003c/code\u003e chưa có. Không chặn, nhưng nếu muốn dùng mã CL05/CL10 thì cần IDP nạp."]], "asks": [{"n": 1, "p": "CHẶN", "t": "Trần trang của một block là bao nhiêu?", "d": "Tenant 177 có \u003ccode\u003eblockLimit 1\u003c/code\u003e, đã dùng 14 trang. Demo ba hồ sơ, mỗi hồ sơ 9 chứng từ là 27 trang, chưa kể chạy thử. Cần biết con số và cần nâng nếu không đủ.", "w": "Con số trần + nâng quota cho tenant 177 tới hết 31/10"}, {"n": 2, "p": "CHẶN", "t": "Ghim flow, sửa flow thì đổi workflowId", "d": "Cùng \u003ccode\u003eworkflowId 5ed8e4fc\u003c/code\u003e nhưng nội dung trả về đã đổi giữa 03/09 và 17/09 (thêm hai mục kiểm mới). Nếu flow đổi giữa lúc dựng và lúc pitch thì toàn bộ phần đọc kết quả của ta vỡ.", "w": "Cam kết ghim flow suốt sprint, và mọi thay đổi đều bump workflowId"}, {"n": 3, "p": "CAO", "t": "HospitalCode / PlaceOfTreatment / SurgeryCodes trả giá trị giữ chỗ", "d": "Chạy thật trên 9 chứng từ đều ghi rõ tên bệnh viện, flow vẫn trả \u003ccode\u003e00000\u003c/code\u003e và \u003ccode\u003e\"null\"\u003c/code\u003e. Lần khác lại bịa ra \u003ccode\u003e01001\u003c/code\u003e (dòng đầu bảng 322) cho chứng từ không có bệnh viện. Phía ta đã tự tra bảng 322 nên không chặn, nhưng đây là lỗi nên sửa.", "w": "Khi không tra được thì trả null nhất quán, tuyệt đối không trả dòng đầu của bảng master"}, {"n": 3, "p": "CAO", "t": "I-16 cần đánh giá theo DÒNG chi phí", "d": "Hiện kết quả là 20 khối văn bản cho cả hồ sơ. Để dùng làm chốt kiểm soát, cần: khuyến nghị gắn với từng dòng chi phí (\u003ccode\u003elinesAssessed[]\u003c/code\u003e), mã lý do đóng (\u003ccode\u003eproposedReasonCode\u003c/code\u003e chỉ NOTREL | NOTCOV) và trích dẫn chứng cứ (\u003ccode\u003eevidence[]\u003c/code\u003e).", "w": "Bổ sung ba trường này vào output flow, hoặc xác nhận là ngoài phạm vi để ta trình bày Track 2 là chế độ tư vấn"}, {"n": 4, "p": "CAO", "t": "warning_level nên tách khỏi mục chỉ mang tính thông tin", "d": "\"Ngày vào viện không đồng nhất\" và \"Kiểm tra Danh mục bệnh viện\" cùng ở mức 1, dù một cái là cảnh báo thật còn một cái chỉ liệt kê. Số lẻ 0.888 cho thấy đây là trung bình cộng, không phải mức nghiêm trọng.", "w": "Hoặc tách mức nghiêm trọng khỏi mục thông tin, hoặc xác nhận rõ ý nghĩa để ta không dùng nhầm làm cổng"}, {"n": 5, "p": "VỪA", "t": "Nạp mbal/template-map cho 9 template mới", "d": "Template 6090–6098 chưa có trong bảng ánh xạ nên \u003ccode\u003esubDocumentType\u003c/code\u003e luôn null. Ta đang định danh bằng templateId nên không chặn.", "w": "Nạp map cho 6090–6098, hoặc xác nhận là không cần"}, {"n": 6, "p": "VỪA", "t": "Xác nhận TTL token, MAX_FILE_SIZE, rate limit thật", "d": "Đang giả định 30 phút và 100 request/60 giây. Demo ba hồ sơ liên tiếp sẽ chạm tới đâu thì chưa biết.", "w": "Ba con số thật trên staging"}, {"n": 7, "p": "VỪA", "t": "Sửa POST /request/from-url", "d": "Trả 400 \"The specified key does not exist.\" — hàm create() coi đường dẫn cục bộ là khoá MinIO. Ta đang nộp bytes nên không chặn.", "w": "Sửa sau hackathon; và xác nhận raw-file còn đọc được sau khi MinIO dọn file"}, {"n": 8, "p": "VỪA", "t": "Cho biết PDF nhiều trang xử lý thế nào", "d": "Chưa test. Cần biết giới hạn số trang, thời gian, và cách dùng separatorType/separatorValue để cắt nhiều chứng từ trong một file scan.", "w": "Hướng dẫn + một ví dụ chạy được"}], "chain": [["1", "POST", "/auth/login", "Lấy token", "356 ms", "auth-login"], ["2", "POST", "/request/group", "Mở nhóm cho hồ sơ", "111 ms", "req-group"], ["3", "POST", "/request", "Nộp từng chứng từ (lặp)", "682 ms", "req-post"], ["4", "GET", "/request/group/{id}/check-status", "Poll 3→5→10→30 s", "12–17 s", "grp-status"], ["5", "GET", "/request/{id}/result", "Copy vào RawExtractionJson", "98 ms", "req-result"], ["6", "GET", "/request/{id}/raw-file", "Giữ bản gốc trước khi MinIO xoá", "170 ms", "raw-file"], ["7", "PUT", "/workflow/request", "Mở phiên đánh giá", "152 ms", "wf-create"], ["8", "GET", "/workflow/run-workflow-request/{id}", "Kích hoạt (retry 3×5 s)", "580 ms", "wf-run"], ["9", "GET", "/workflow/request/{id}", "Poll tới status 3", "72 s · 118 s (9 chứng từ)", "wf-poll"], ["10", "GET", ng master 322 (BỆNH VIỆN HỮU NGHỊ).", "f": "Không dùng \u003ccode\u003eHospitalCode\u003c/code\u003e / \u003ccode\u003ePlaceOfTreatment\u003c/code\u003e từ flow. Tra bảng 322 qua OpenSearch.", "api": "os-search"}, {"t": "templates phải là chuỗi CSV, không phải mảng", "sev": "Vừa", "d": "Swagger khai \u003ccode\u003etemplates: [number]\u003c/code\u003e. Gửi đúng như Swagger thì nhận \u003ccode\u003e400 invalid input syntax for type bigint: NaN\u003c/code\u003e.", "f": "Gửi \u003ccode\u003e\"6090,6091,6092\"\u003c/code\u003e. Riêng \u003ccode\u003e/request/from-url\u003c/code\u003e và \u003ccode\u003ePOST /template/document-set\u003c/code\u003e lại nhận mảng số — ba endpoint, hai quy ước.", "api": "req-post"}, {"t": "autoStart không có tác dụng", "sev": "Vừa", "d": "\u003ccode\u003ePUT /workflow/request\u003c/code\u003e nhận \u003ccode\u003eautoStart: \"true\"\u003c/code\u003e, trả 200, rồi lưu \u003ccode\u003efalse\u003c/code\u003e. Phiên nằm im mãi ở status 2.", "f": "Luôn gọi \u003ccode\u003eGET /workflow/run-workflow-request/{id}\u003c/code\u003e ngay sau đó, có retry 3 lần cách 5 s (đây là ngoại lệ 4xx-retry duy nhất).", "api": "wf-run"}, {"t": "Nội dung flow đổi mà workflowId không đổi", "sev": "Vừa", "d": "Cùng \u003ccode\u003e5ed8e4fc\u003c/code\u003e, ngày 03/09 trả một bộ mục, ngày 17/09 trả bộ khác (thêm \"Kiểm tra thông tin cá nhân\", \"Kiểm tra mã bệnh bẩm sinh\"). Thời gian chạy cũng nhảy từ ~30 s lên 72 s.", "f": "Đề nghị IDP: sửa flow thì bump workflowId. Phía ta đặt trần poll ≥ 3 phút và ghi phiên bản nội dung nhận được.", "api": "wf-poll"}, {"t": "Thiếu tham số bắt buộc mà Swagger không khai", "sev": "Nhẹ", "d": "\u003ccode\u003e/template/document-set-list\u003c/code\u003e thiếu \u003ccode\u003esort\u003c/code\u003e → 400 \"missing FROM-clause\". \u003ccode\u003e/flows/assigns/all\u003c/code\u003e thiếu \u003ccode\u003etarget_tenant_id\u003c/code\u003e → 500 NaN.", "f": "Truyền đủ tham số ngay từ đầu; đừng tin Swagger về tính bắt buộc.", "api": "docs <script>
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById('payload').textContent);
  var APIS = D.apis, byId = {};
  APIS.forEach(function(a){ byId[a.id] = a; });

  var GROUPS = ['Xác thực','Trích xuất','Đánh giá lâm sàng','Template & master data','Vận hành'];
  var GSTEP = {
    'Xác thực':'Bước 1 của chuỗi',
    'Trích xuất':'Bước 2–6 · I-07 / I-09',
    'Đánh giá lâm sàng':'Bước 7–10 · I-15 / I-16',
    'Template & master data':'Cấu hình trước demo',
    'Vận hành':'Giám sát'
  };
  var ST_LABEL = {'THẬT':'đã gọi thật','BẪY':'bẫy','LỖI-ĐÚNG':'lỗi đúng dự đoán','HỎNG':'đang hỏng','CẤM':'cấm gọi','CHƯA':'chưa gọi'};

  var state = { tab:'catalog', q:'', grp:'', pri:'', st:'' };

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function el(id){ return document.getElementById(id); }

  /* ---------------- catalogue ---------------- */
  function match(a){
    if(state.grp && a.grp !== state.grp) return false;
    if(state.pri && a.pri !== state.pri) return false;
    if(state.st && a.st !== state.st) return false;
    if(state.q){
      var q = state.q.toLowerCase();
      var hay = (a.path+' '+a.name+' '+a.purpose+' '+a.method+' '+a.grp).toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    return true;
  }

  function rowHtml(a){
    return '<button class="row" data-go="'+a.id+'">'
      + '<span class="m '+a.method.split(' ')[0]+'">'+esc(a.method.split(' ')[0])+'</span>'
      + '<span class="txt"><span class="p">'+esc(a.path)+'</span><span class="nm">'+esc(a.name)+'</span></span>'
      + '<span class="rt">'
        + (a.ms ? '<span class="ms" title="Thời gian đo thật">'+esc(a.ms)+'</span>' : '')
        + '<span class="pri '+a.pri+'">'+esc(a.pri)+'</span>'
        + '<span class="pill '+a.st+'">'+esc(ST_LABEL[a.st]||a.st)+'</span>'
        + '<span class="arrow">›</span>'
      + '</span></button>';
  }

  function renderCatalog(){
    var shown = APIS.filter(match);
    var counts = { total:APIS.length, p0:0, that:0, cam:0, bay:0 };
    APIS.forEach(function(a){
      if(a.pri==='P0') counts.p0++;
      if(a.st==='THẬT'||a.st==='BẪY'||a.st==='LỖI-ĐÚNG'||a.st==='HỎNG') counts.that++;
      if(a.st==='CẤM') counts.cam++;
    });
    counts.bay = D.traps.length;

    var h = ''
      + '<div class="stats five">'
      +   '<div class="stat"><b>'+counts.total+'</b><span>API trong phạm vi hackathon</span></div>'
      +   '<div class="stat"><b>'+counts.p0+'</b><span>P0 — không có thì demo đứng</span></div>'
      +   '<div class="stat ok"><b>'+counts.that+'</b><span>đã gọi thật trên tenant 177</span></div>'
      +   '<div class="stat warn"><b>'+counts.bay+'</b><span>bẫy phải hấp thụ ở adapter</span></div>'
      +   '<div class="stat bad"><b>'+counts.cam+'</b><span>cấm gọi</span></div>'
      + '</div>'
      + '<p class="lead">Danh mục API của BnK IDP dùng cho Agentic Health Claim. Mỗi dòng là một lời gọi đã được chạy thật trên tenant 177 ngày 17/09/2026 (trừ các mục ghi <i>chưa gọi</i>). Bấm vào một API để xem đầu vào, phản hồi thật và quy tắc adapter phải tuân theo.</p>'
      + '<div class="filters">'
      +   '<input class="search" id="q" type="search" placeholder="Tìm theo đường dẫn, tên, mục đích…" value="'+esc(state.q)+'">'
      +   '<div class="chipgroup" id="fgrp">'
      +     '<button class="chip" data-f="pri" data-v="P0" aria-pressed="'+(state.pri==='P0')+'">P0</button>'
      +     '<button class="chip" data-f="st" data-v="THẬT" aria-pressed="'+(state.st==='THẬT')+'">Đã gọi thật</button>'
      +     '<button class="chip" data-f="st" data-v="CẤM" aria-pressed="'+(state.st==='CẤM')+'">Cấm gọi</button>'
      +   '</div>'
      + '</div>';

    if(!shown.length){
      h += '<div class="empty">Không có API nào khớp bộ lọc.</div>';
    } else {
      GROUPS.forEach(function(g){
        var items = shown.filter(function(a){ return a.grp === g; });
        if(!items.length) return;
        h += '<div class="grouphead"><h2>'+esc(g)+'</h2><span class="cnt">'+items.length+' API</span><span class="gstep">'+esc(GSTEP[g]||'')+'</span></div>';
        h += '<div class="list">' + items.map(rowHtml).join('') + '</div>';
      });
    }
    el('view-catalog').innerHTML = h;
    el('n-catalog').textContent = APIS.length;
    var q = el('q');
    if(q){
      q.addEventListener('input', function(){
        state.q = q.value;
        var pos = q.selectionStart;
        renderCatalog();
        var nq = el('q'); nq.focus(); try{ nq.setSelectionRange(pos,pos); }catch(e){}
      });
    }
  }

  /* ---------------- detail ---------------- */
  function kvTable(head, rows, cls){
    if(!rows || !rows.length) return '';
    return '<div class="tw"><table class="'+(cls||'')+'"><thead><tr>'
      + head.map(function(x){ return '<th>'+x+'</th>'; }).join('')
      + '</tr></thead><tbody>'
      + rows.map(function(r){
          return '<tr>' + r.map(function(c,i){
            return '<td'+(i===0?' class="k"':'')+'>'+c+'</td>';
          }).join('') + '</tr>';
        }).join('')
      + '</tbody></table></div>';
  }

  function ioBlock(kind){
    var img = '<figure class="shot"><img src="'+D.img+'" alt="Bảng kê chi phí khám bệnh, chữa bệnh — chứng từ giả lập dùng để test">'
      + '<figcaption><b>Chứng từ nộp lên</b> — bảng kê chi phí giả lập, PNG 1240×1754, 16 KB. Không có dữ liệu cá nhân thật: tên, mã bệnh nhân, số thẻ đều là giá trị bịa.</figcaption></figure>';
    if(kind === 'doc'){
      return '<div class="sec"><h3>Ảnh chứng từ đã nộp</h3><div class="io">' + img
        + '<div><p style="font-size:13.5px;color:var(--ink-2);margin-bottom:12px">Một request = một file. IDP nhận cả danh sách template rồi tự quyết định chứng từ này thuộc loại nào — ở đây là template <code>6091</code> trong số 9 template được gửi kèm.</p>'
        + kvTable(['Thuộc tính','Giá trị'], [
            ['name','CLM-2026-000123 <span style="color:var(--muted)">(= claimNo)</span>'],
            ['templates','<code>6090,6091,6092,6093,6094,6095,6096,6097,6098</code>'],
            ['document','bangke_demo.png · 16 KB'],
            ['→ requestId','<b>21392</b>'],
            ['→ pageCount','1 trang · trừ 1 trang quota']
          ])
        + '</div></div></div>';
    }
    // result
    var fields = D.fields.map(function(f){
      var v = f[1] === '' ? '<span style="color:var(--faint)">(rỗng)</span>' : esc(f[1]);
      return ['<code>'+esc(f[0])+'</code>', v, '<span class="mono">'+f[2].toFixed(4)+'</span>'];
    });
    var fh = '<div class="tw"><table><thead><tr><th>Field (k)</th><th>Giá trị (v)</th><th style="text-align:right">c</th></tr></thead><tbody>'
      + fields.map(function(r){ return '<tr><td class="k">'+r[0]+'</td><td>'+r[1]+'</td><td class="num">'+r[2]+'</td></tr>'; }).join('')
      + '</tbody></table></div>';
    var t = D.table;
    var th = '<div class="tw"><table><thead><tr>' + t.head.map(function(x){ return '<th>'+esc(x)+'</th>'; }).join('') + '</tr></thead><tbody>'
      + t.rows.map(function(r){
          return '<tr>' + r.map(function(c,i){
            return '<td'+(i>=2?' class="num"':'')+'>'+esc(c)+'</td>';
          }).join('') + '</tr>';
        }).join('')
      + '</tbody></table></div>';
    return '<div class="sec"><h3>Ảnh vào → dữ liệu ra</h3>'
      + '<div class="io">' + img
      + '<div><p style="font-size:13.5px;color:var(--ink-2);margin-bottom:12px">Kết quả thật của request <b>21392</b>: phân loại đúng template <code>6091</code>, bóc ra 26 field và một bảng 13 cột. Các số tiền về <b>đủ chữ số</b> — đây là thứ phải kiểm bằng mắt trước khi tin chuỗi tính tiền.</p>'
      + fh + '</div></div>'
      + '<h3 style="margin-top:20px">Bảng '+esc(t.name)+' <span style="text-transform:none;letter-spacing:0;color:var(--faint)">— rút gọn còn 7/13 cột</span></h3>' + th
      + '<p class="note">Đơn giá BV và Thành tiền BV trả về 150000 / 4500000 / 1500 — không còn dấu chấm, không bị cắt mất phần nghìn như template cũ. Công là nhờ câu “chỉ lấy chữ số, bỏ dấu phân cách hàng nghìn” trong mô tả field.</p>'
      + '</div>';
  }

  function renderDetail(id){
    var a = byId[id];
    if(!a){ location.hash = ''; return; }
    var m0 = a.method.split(' ')[0];
    var resCls = (a.st==='HỎNG'||a.st==='CẤM') ? 'bad' : (a.st==='LỖI-ĐÚNG'||a.st==='BẪY' ? 'warn' : '');

    var h = '<button class="back" data-back="1">‹ Tất cả API</button>'
      + '<div class="dhead">'
      +   '<div class="line1">'
      +     '<span class="m '+m0+'">'+esc(m0)+'</span>'
      +     '<span class="path">'+esc(a.path)+'</span>'
      +     '<span class="pill '+a.st+'">'+esc(ST_LABEL[a.st]||a.st)+'</span>'
      +     '<span class="pri '+a.pri+'">'+esc(a.pri)+'</span>'
      +   '</div>'
      +   '<h2>'+esc(a.name)+'</h2>'
      +   '<p class="purpose">'+esc(a.purpose)+'</p>'
      +   '<div class="meta">'
      +     '<span><b>Nhóm</b> '+esc(a.grp)+'</span>'
      +     (a.ms ? '<span><b>Đo thật</b> '+esc(a.ms)+'</span>' : '')
      +     '<span><b>Giao diện D3</b> '+a.d3+'</span>'
      +     '<span><b>Bên gọi</b> '+a.consumer+'</span>'
      +   '</div>'
      + '</div>'
      + '<div class="cols"><div>';

    if(a.inp && a.inp.length){
      h += '<div class="sec"><h3>Đầu vào</h3>'
        + kvTable(['Tham số','Kiểu','Bắt buộc','Ghi chú'], a.inp.map(function(r){
            return [ '<code>'+r[0]+'</code>', r[1], r[2], r[3] ];
          }), 'req')
        + '</div>';
    }
    if(a.out && a.out.length){
      h += '<div class="sec"><h3>Đầu ra</h3>'
        + kvTable(['Trường','Kiểu','Ý nghĩa'], a.out.map(function(r){
            return [ '<code>'+r[0]+'</code>', r[1], r[2] ];
          }))
        + '</div>';
    }
    if(a.req){
      h += '<div class="sec"><h3>Lời gọi</h3><pre>'+esc(a.req)+'</pre></div>';
    }
    if(a.res){

      + '<div class="stats" style="margin-bottom:24px">'
      +   '<div class="stat ok"><b>9/9</b><span>phân loại đúng (8/9 lần đầu)</span></div>'
      +   '<div class="stat ok"><b>4/4</b><span>điểm lệch cài sẵn bị bắt</span></div>'
      +   '<div class="stat"><b>118 s</b><span>đánh giá lâm sàng 9 chứng từ</span></div>'
      +   '<div class="stat warn"><b>3</b><span>trường master data trả giữ chỗ</span></div>'
      + '</div>'
      + '<div class="sec"><h3>Bước 1–5 · Phân loại và trích xuất</h3>'
      +   '<div class="tw"><table><thead><tr><th>Ảnh mẫu</th><th>Chứng từ</th><th>Template nhận</th><th>Kết quả</th><th style="text-align:right">Conf</th><th>Field bóc được</th><th style="text-align:right">Giây</th></tr></thead><tbody>'+xv+'</tbody></table></div>'

      + '</div>'

  /* ---------------- traps ---------------- */

      + '<p class="hint">Khi nộp vẫn truyền chuỗi CSV id — <code>POST /request</code> không nhận id của bộ chứng từ. Bộ 198 chỉ để quản lý và để người sau biết bộ nào đang dùng.</p>'
      + '<div class="sec" style="margin-top:28px"><h3>Chưa dựng lại</h3>'
      + '<p style="font-size:13.5px;color:var(--ink-2);max-width:70ch">Tám template còn lại của tenant 176 (5299 · 5340 · 5312 · 5218 · 5125 · 5126 · 5128 · 5130 — hoá đơn GTGT, giấy nghỉ việc hưởng BHXH, giấy đề nghị bồi thường) chưa có định nghĩa JSON trong nguồn hiện có, nên chưa dựng lại được. Không chặn demo ba hồ sơ. Hoá đơn điện tử XML vẫn do phía ODC tự parse, không cần template.</p></div>';

  /* ---------------- việc cần đội IDP ---------------- */
  function md(x){ return String(x)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>'); }

  function renderTodo(){
    var counts = {'CHẶN':0,'CAO':0,'VỪA':0};
    D.idptodo.forEach(function(t){ counts[t.p]++; });

    var tl = D.lich.map(function(l){
      return '<div class="st '+l[2]+'"><b>'+esc(l[0])+'</b><span>'+esc(l[1])+'</span></div>';
    }).join('');

    var ds = D.done_self.map(function(d){
      return '<tr><td class="k">'+esc(d[0])+'</td><td>'+md(d[1])+'</td></tr>';
    }).join('');

    var items = D.idptodo.map(function(t){
      return '<article class="item '+t.p+'"><span class="no">'+t.n+'</span><div class="body">'
        + '<div class="hd"><h3>'+esc(t.t)+'</h3>'
        + '<span class="pill '+(t.p==='CHẶN'?'CẤM':(t.p==='CAO'?'BẪY':'CHƯA'))+'">'+esc(t.p)+'</span>'
        + '<span class="han">hạn '+esc(t.han)+'</span></div>'
        + '<div class="why">'+md(t.why)+'</div>'
        + '<div class="do"><h4>Cần đội IDP làm gì</h4><ul>'
        +   t.do.map(function(x){ return '<li>'+md(x)+'</li>'; }).join('')
        + '</ul></div>'
        + '<div class="risk"><span class="lab">Nếu không có</span><span>'+md(t.risk)+'</span></div>'
        + '</div></article>';
    }).join('');

    el('view-todo').innerHTML = ''
      + '<div class="deadline"><b>Pitch 07–08/10/2026</b>'
      +   '<span>còn <b style="font-size:13.5px">20 ngày</b> tính từ 17/09</span>'
      +   '<span>Hai việc dưới đây có thể làm demo đứng giữa chừng — mọi thứ còn lại đều đã có đường lui.</span></div>'
      + '<div class="ctx"><h3>Gửi đội BnK IDP</h3>'
      +   '<p>BnK Solution đang dựng bài dự thi <b>OutSystems Partner Hackathon APAC 2026</b> trên nền BnK IDP, pitch ngày 07–08/10.</p>'
      +   '<p>Ngày 17/09 đã chạy thử trọn luồng trên tenant 177: nộp 9 chứng từ y tế, phân loại, trích xuất, rồi đưa cả 9 qua flow đánh giá lâm sàng <code>5ed8e4fc</code>. '
      +   'Kết quả tốt — phân loại đúng <b>9/9</b>, flow phát hiện được các điểm không đồng nhất giữa các chứng từ. Mọi con số trong tài liệu này là <b>đo thật</b> trên staging, không phải ước lượng.</p>'
      +   '<p>Phần lớn vướng mắc đã tự xử lý được (bảng bên dưới). Còn lại chín việc kỹ thuật chỉ đội IDP làm được, xếp theo mức ảnh hưởng — mỗi việc ghi rõ <b>vì sao cần</b>, <b>phải làm cụ thể cái gì</b>, và <b>hậu quả nếu không có</b>.</p></div>'
      + '<div class="stats" style="margin-bottom:22px">'
      +   '<div class="stat bad"><b>'+counts['CHẶN']+'</b><span>việc chặn — demo đứng nếu thiếu</span></div>'
      +   '<div class="stat warn"><b>'+counts['CAO']+'</b><span>ảnh hưởng chất lượng demo</span></div>'
      +   '<div class="stat"><b>'+counts['VỪA']+'</b><span>nhỏ hơn, có đường lui</span></div>'
      +   '<div class="stat ok"><b>6</b><span>vướng mắc đã tự xử lý</span></div>'
      + '</div>'
      + '<div class="sec"><h3>Lịch đề nghị</h3><div class="tl">'+tl+'</div></div>'
      + '<div class="sec"><h3>Những vướng mắc đã tự xử lý — không cần đội IDP</h3>'
      +   '<div class="tw"><table><thead><tr><th>Vướng mắc</th><th>Đã xử lý thế nào</th></tr></thead><tbody>'+ds+'</tbody></table></div>'
      +   '<p class="note">Liệt kê ở đây để danh sách đề nghị bên dưới không dài hơn mức cần thiết.</p>'
      + '</div>'
      + '<div class="sec"><h3>Chín việc kỹ thuật cần đội IDP</h3><div class="todo">'+items+'</div></div>';


  }

  /* ---------------- routing ---------------- */
  function show(view){
    ['catalog','detail','chain','flow','traps','tpl','todo'].forEach(function(v){
      el('view-'+v).hidden = (v !== view);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
      var active = (view === 'detail') ? (t.dataset.tab === 'catalog') : (t.dataset.tab === view);
      t.setAttribute('aria-selected', active ? 'true' : 'false');
    });
  }

  function route(){
    var hash = location.hash.replace(/^#\/?/, '');
    if(hash.indexOf('api/') === 0){
      renderDetail(hash.slice(4));
      show('detail');
      window.scrollTo(0,0);
      return;
    }
    var tab = hash || 'catalog';
    if(['catalog','chain','flow','traps','tpl','todo'].indexOf(tab) < 0) tab = 'catalog';
    state.tab = tab;
    show(tab);
  }

  document.addEventListener('click', function(ev){
    var t = ev.target.closest('[data-go]');
    if(t){ location.hash = '#/api/' + t.dataset.go; return; }
    if(ev.target.closest('[data-back]')){ location.hash = '#/catalog'; return; }
    var tab = ev.target.closest('.tab');
    if(tab){ location.hash = '#/' + tab.dataset.tab; return; }
    var chip = ev.target.closest('.chip');
    if(chip){
      var f = chip.dataset.f, v = chip.dataset.v;
      state[f] = (state[f] === v) ? '' : v;
      renderCatalog();
      return;
    }
  });

  window.addEventListener('hashchange', route);

  renderCatalog();
  renderChain();
  renderFlow();
  renderTraps();
  renderTpl();
  renderTodo();
  el('n-traps').textContent = D.traps.length;
  route();
})();
</script>
